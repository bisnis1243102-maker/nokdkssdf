name: Build APK (Android)

# Builds installable debug .apk files for the Android (WebGL) games
# and attaches them to the "latest" GitHub Release.

on:
  push:
    branches:
      - claude/mobile-gaming-app-roblox-3f27o5
      - claude/subway-surfers-apk-4oevl2
    paths:
      - 'AndroidGame/**'
      - 'SubwayRunner/**'
      - 'BrawlArena/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ForsaHorizon6
            dir: AndroidGame
          - name: SubwayDash
            dir: SubwayRunner
          - name: BrawlArena
            dir: BrawlArena
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'   # AGP 8.1.4 is not compatible with Gradle 9.x

      - name: Build debug APK
        working-directory: ${{ matrix.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          set -e
          SRC=$(find ${{ matrix.dir }} -path '*/outputs/apk/debug/*.apk' | head -n1)
          echo "Found: $SRC"
          cp "$SRC" ${{ matrix.name }}.apk
          ls -lh ${{ matrix.name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: ${{ matrix.name }}.apk
          if-no-files-found: error

      - name: Attach APK to the "latest" Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest unsigned builds
          files: ${{ matrix.name }}.apk
          fail_on_unmatched_files: true
