name: Build IPA (unsigned)

# Produces UNSIGNED .ipa artifacts for each app in the repo.
# Sign them on-device afterwards with KSign / your preferred sideloading tool.

on:
  push:
    branches:
      - claude/mobile-gaming-app-roblox-3f27o5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rivals
            project: Rivals/Rivals.xcodeproj
            scheme: Rivals
          - name: BloomTycoon
            project: GrowAGarden2/GrowAGarden2.xcodeproj
            scheme: GrowAGarden2
          - name: ForsaHorizon
            project: LibertyDrive/LibertyDrive.xcodeproj
            scheme: LibertyDrive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build ${{ matrix.name }} (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package ${{ matrix.name }} into .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/${{ matrix.scheme }}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: $APP_PATH not found"; find build -name '*.app' -maxdepth 5 -type d; exit 1
          fi
          rm -rf Payload "${{ matrix.name }}-unsigned.ipa"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "${{ matrix.name }}-unsigned.ipa" Payload
          echo "Built IPA:"; ls -lh "${{ matrix.name }}-unsigned.ipa"

      - name: Upload ${{ matrix.name }} IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-unsigned-ipa
          path: ${{ matrix.name }}-unsigned.ipa
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all IPA artifacts
        uses: actions/download-artifact@v4
        with:
          path: ipas

      - name: Publish/refresh the "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest unsigned builds
          body: |
            Unsigned `.ipa` builds, refreshed on every push.
            Tap a file below to download directly (no zip), then sign with KSign.
          files: ipas/**/*.ipa
          fail_on_unmatched_files: true
