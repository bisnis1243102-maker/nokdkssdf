name: Games
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targetTemplates:
  WebGame:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Shared
    info:
      path: Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: ${display_name}
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
targets:
  PlanetHopper:
    templates: [WebGame]
    templateAttributes:
      display_name: Planet Hopper
    sources:
      - path: Icons/PlanetHopper.xcassets
      - path: Web/PlanetHopper/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planethopper.game
  BeatBattle:
    templates: [WebGame]
    templateAttributes:
      display_name: Beat Battle
    sources:
      - path: Icons/BeatBattle.xcassets
      - path: Web/BeatBattle/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beatbattle.game
