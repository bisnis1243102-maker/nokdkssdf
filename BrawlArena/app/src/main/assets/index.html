<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Brawl Arena</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20242e;touch-action:none;
            font-family:-apple-system,Roboto,sans-serif;-webkit-user-select:none;user-select:none;}
  #c{display:block;width:100vw;height:100vh;}
  .ovl{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
       justify-content:center;text-align:center;color:#fff;background:rgba(10,14,26,.78);z-index:5;}
  .ttl{font-size:44px;font-weight:900;letter-spacing:2px;color:#ffd11a;
       -webkit-text-stroke:2px #8d3b0e;text-shadow:0 4px 0 #8d3b0e,0 8px 22px rgba(0,0,0,.5);}
  .sub{margin-top:4px;font-size:15px;font-weight:700;color:#8fd2ff;}
  .cards{display:flex;gap:14px;margin-top:26px;}
  .card{width:118px;padding:12px 8px 10px;border-radius:14px;background:#2c3242;border:3px solid #3d4660;
        color:#fff;font-weight:800;}
  .card.sel{border-color:#ffd11a;background:#3a4258;transform:scale(1.06);}
  .card .face{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;border:3px solid rgba(255,255,255,.7);}
  .card .nm{font-size:16px;}
  .card .desc{font-size:10.5px;font-weight:600;opacity:.85;margin-top:4px;line-height:1.35;}
  .tap{margin-top:26px;font-size:21px;font-weight:900;color:#7bff9e;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .stat{margin-top:10px;font-size:17px;font-weight:800;}
  .stat b{color:#ffd11a;}
  #over{display:none;}
  #menuTrophy{margin-top:6px;font-size:15px;font-weight:800;color:#ffd11a;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="ovl">
  <div class="ttl">BRAWL ARENA</div>
  <div class="sub">SHOWDOWN — 10 fighters, one survivor</div>
  <div id="menuTrophy">🏆 0</div>
  <div class="cards" id="cards"></div>
  <div class="tap">TAP TO BRAWL</div>
  <div class="sub" style="margin-top:14px;opacity:.8">Left side: move • Right side: aim &amp; shoot • Big button: SUPER</div>
</div>

<div id="over" class="ovl">
  <div class="ttl" id="rankTtl">RANK 1</div>
  <div class="stat" id="trophyDelta">+10 🏆</div>
  <div class="stat" id="trophyTotal">TOTAL <b>0</b> 🏆</div>
  <div class="stat" id="cubeStat">POWER CUBES <b>0</b></div>
  <div class="tap">TAP TO CONTINUE</div>
</div>

<script>
'use strict';
/* ============ canvas ============ */
const cv=document.getElementById('c'), cx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; }
resize(); addEventListener('resize',resize);

/* ============ audio ============ */
let AC=null;
function beep(f0,f1,dur,type,vol){ if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,AC.currentTime);
  o.frequency.linearRampToValueAtTime(f1,AC.currentTime+dur);
  g.gain.setValueAtTime(vol||.12,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+dur); }
const sShot=()=>beep(700,420,.07,'square',.05), sHit=()=>beep(240,160,.08,'sawtooth',.07),
      sBoom=()=>beep(150,50,.3,'sawtooth',.16), sCube=()=>beep(880,1320,.12,'sine',.09),
      sSuper=()=>{beep(500,900,.13,'square',.08);setTimeout(()=>beep(700,1250,.15,'square',.08),90);},
      sDead=()=>beep(300,60,.5,'sawtooth',.14);

/* ============ world ============ */
const TILE=48, MW=40, MH=40, WORLD=MW*TILE;
let map=[];              // 0 empty 1 wall 2 bush 3 box
let boxHp={};
function tile(tx,ty){ return (tx<0||ty<0||tx>=MW||ty>=MH)?1:map[ty*MW+tx]; }
function genMap(){
  map=new Array(MW*MH).fill(0); boxHp={};
  for(let i=0;i<MW;i++){ map[i]=1; map[(MH-1)*MW+i]=1; map[i*MW]=1; map[i*MW+MW-1]=1; }
  const R=(a,b)=>a+Math.random()*(b-a)|0;
  for(let k=0;k<26;k++){                        // rock clusters
    const x=R(3,MW-6),y=R(3,MH-6),w=R(1,4),h=R(1,4);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++) map[(y+j)*MW+x+i]=1;
  }
  for(let k=0;k<20;k++){                        // bush patches
    const x=R(2,MW-7),y=R(2,MH-7),w=R(2,5),h=R(2,5);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++)
      if(map[(y+j)*MW+x+i]===0) map[(y+j)*MW+x+i]=2;
  }
  let placed=0;                                  // loot boxes
  while(placed<26){
    const x=R(4,MW-4),y=R(4,MH-4);
    if(map[y*MW+x]===0){ map[y*MW+x]=3; boxHp[y*MW+x]=3000; placed++; }
  }
}

/* ============ characters ============ */
const CHARS={
  buck:{name:'BUCK', col:'#ff8b2e', hp:5000, spd:185, ammoT:1.5, range:235,
        desc:'Shotgun burst.<br>SUPER: leap + blast', superNeed:4500,
        fire(p,ang){ for(let i=-2;i<=2;i++)
            spawnBullet(p,ang+i*.09,640,235,380*(1+.08*p.cubes),4,'#ffb066'); },
        superCast(p,ang,target){ p.leap={t:.45,sx:p.x,sy:p.y,
            tx:p.x+Math.cos(ang)*Math.min(260,target||260),
            ty:p.y+Math.sin(ang)*Math.min(260,target||260)}; }},
  vera:{name:'VERA', col:'#4da3ff', hp:3600, spd:172, ammoT:2.0, range:465,
        desc:'Long sniper shot.<br>SUPER: piercing rail', superNeed:4000,
        fire(p,ang){ spawnBullet(p,ang,920,465,1300*(1+.08*p.cubes),4.5,'#9fd0ff'); },
        superCast(p,ang){ spawnBullet(p,ang,1050,640,2200*(1+.08*p.cubes),7,'#e0f4ff',true); }},
  dyno:{name:'DYNO', col:'#54d66a', hp:4300, spd:167, ammoT:1.8, range:320,
        desc:'Lobbed bombs.<br>SUPER: rocket rain', superNeed:5000,
        fire(p,ang,dist){ spawnLob(p,ang,Math.min(dist||320,320),1050*(1+.08*p.cubes),85,.55); },
        superCast(p,ang,dist){ const d=Math.min(dist||300,340);
          const tx=p.x+Math.cos(ang)*d, ty=p.y+Math.sin(ang)*d;
          for(let i=0;i<6;i++) setTimeout(()=>{ if(state==='play')
            explosions.push({x:tx+(Math.random()-.5)*220,y:ty+(Math.random()-.5)*220,
              t:.45,delay:0,r:72,dmg:700*(1+.08*p.cubes),owner:p,boom:true}); },i*190); }},
};
const CHARKEYS=Object.keys(CHARS);

/* ============ entities ============ */
let players=[],bullets=[],lobs=[],explosions=[],cubesArr=[],pops=[],fxs=[];
let me=null, state='menu', elapsed=0, zoneMargin=0, zoneT=0, shake=0;
let trophies=+(localStorage.getItem('ba_trophies')||0);
const BOTNAMES=['Rex','Nova','Pip','Kilo','Mara','Zed','Juno','Tank','Ollie'];

function spawnBullet(p,ang,spd,range,dmg,r,col,pierce){
  bullets.push({x:p.x+Math.cos(ang)*24,y:p.y+Math.sin(ang)*24,
    vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,dmg,owner:p,range,d:0,r,col,pierce:!!pierce});
  p.shotT=1; sShot();
}
function spawnLob(p,ang,dist,dmg,rad,air){
  lobs.push({x:p.x,y:p.y,tx:p.x+Math.cos(ang)*dist,ty:p.y+Math.sin(ang)*dist,
    t:0,air,dmg,rad,owner:p});
  p.shotT=1; sShot();
}
function makePlayer(charKey,bot,ix){
  const ch=CHARS[charKey];
  const ang=ix/10*Math.PI*2, rad=WORLD*.38;
  let x=WORLD/2+Math.cos(ang)*rad, y=WORLD/2+Math.sin(ang)*rad;
  const tx=x/TILE|0, ty=y/TILE|0;               // clear spawn area
  for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++)
    if(tile(tx+i,ty+j)!==0 && tx+i>0&&ty+j>0&&tx+i<MW-1&&ty+j<MH-1){ map[(ty+j)*MW+tx+i]=0; }
  return {x,y,r:19,char:charKey,ch,bot,alive:true,name:bot?BOTNAMES[ix-1]:'YOU',
    hp:ch.hp,maxhp:ch.hp,cubes:0,ammo:3,reload:0,super:0,aim:Math.random()*Math.PI*2,
    vx:0,vy:0,shotT:0,hurtT:0,ai:{},leap:null};
}

/* ============ collision helpers ============ */
function wallAt(x,y){ const t=tile(x/TILE|0,y/TILE|0); return t===1||t===3; }
function moveCircle(p,dx,dy){
  const r=p.r;
  let nx=p.x+dx;
  if(!wallAt(nx-r,p.y-r*.6)&&!wallAt(nx+r,p.y-r*.6)&&!wallAt(nx-r,p.y+r*.6)&&!wallAt(nx+r,p.y+r*.6)) p.x=nx;
  let ny=p.y+dy;
  if(!wallAt(p.x-r*.6,ny-r)&&!wallAt(p.x+r*.6,ny-r)&&!wallAt(p.x-r*.6,ny+r)&&!wallAt(p.x+r*.6,ny+r)) p.y=ny;
  p.x=Math.max(TILE+r,Math.min(WORLD-TILE-r,p.x));
  p.y=Math.max(TILE+r,Math.min(WORLD-TILE-r,p.y));
}
function los(a,b){                              // line of sight (walls block)
  const steps=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/24);
  for(let i=1;i<steps;i++){
    const x=a.x+(b.x-a.x)*i/steps, y=a.y+(b.y-a.y)*i/steps;
    if(tile(x/TILE|0,y/TILE|0)===1) return false;
  }
  return true;
}
function inBush(p){ return tile(p.x/TILE|0,p.y/TILE|0)===2; }
function visibleTo(viewer,p){
  if(!p.alive) return false;
  if(inBush(p) && p.shotT<=0 && Math.hypot(p.x-viewer.x,p.y-viewer.y)>150) return false;
  return true;
}

/* ============ damage ============ */
function damage(target,dmg,src){
  if(!target.alive) return;
  target.hp-=dmg; target.hurtT=1; target.regenT=0;
  pops.push({x:target.x,y:target.y-26,t:.8,txt:Math.round(dmg),col:'#ff6a5a'});
  if(src&&src.alive){ src.super=Math.min(src.ch.superNeed,src.super+dmg); }
  if(target===me) shake=Math.min(1,shake+.35);
  sHit();
  if(target.hp<=0){
    target.alive=false; sDead();
    for(let i=0;i<target.cubes;i++)
      cubesArr.push({x:target.x+(Math.random()-.5)*50,y:target.y+(Math.random()-.5)*50});
    fxs.push({x:target.x,y:target.y,t:.6,r:44,col:target.ch.col});
    if(target===me) endMatch(players.filter(p=>p.alive).length+1);
    else if(me.alive && players.filter(p=>p.alive).length===1) endMatch(1);
  }
}
function hitBox(txy,dmg){
  boxHp[txy]-=dmg;
  if(boxHp[txy]<=0){
    const bx=(txy%MW)*TILE+TILE/2, by=(txy/MW|0)*TILE+TILE/2;
    map[txy]=0; delete boxHp[txy];
    cubesArr.push({x:bx,y:by}); sBoom();
    fxs.push({x:bx,y:by,t:.4,r:30,col:'#c9995c'});
  }
}

/* ============ match flow ============ */
let chosen='buck';
function startMatch(){
  genMap();
  players=[]; bullets=[]; lobs=[]; explosions=[]; cubesArr=[]; pops=[]; fxs=[];
  me=makePlayer(chosen,false,0);
  players.push(me);
  for(let i=1;i<10;i++) players.push(makePlayer(CHARKEYS[(Math.random()*3)|0],true,i));
  elapsed=0; zoneMargin=0; zoneT=15; state='play';
  document.getElementById('menu').style.display='none';
  document.getElementById('over').style.display='none';
}
function endMatch(rank){
  if(state!=='play') return;
  state='over';
  const delta=[0,10,8,6,4,2,0,0,-1,-2,-2][rank]||0;
  trophies=Math.max(0,trophies+delta);
  try{localStorage.setItem('ba_trophies',trophies);}catch(e){}
  document.getElementById('rankTtl').textContent = rank===1?'VICTORY!':'RANK '+rank;
  document.getElementById('trophyDelta').textContent=(delta>=0?'+':'')+delta+' 🏆';
  document.getElementById('trophyTotal').innerHTML='TOTAL <b>'+trophies+'</b> 🏆';
  document.getElementById('cubeStat').innerHTML='POWER CUBES <b>'+me.cubes+'</b>';
  setTimeout(()=>{ document.getElementById('over').style.display='flex'; },900);
}

/* ============ menu ============ */
const cardsEl=document.getElementById('cards');
function buildMenu(){
  document.getElementById('menuTrophy').textContent='🏆 '+trophies;
  cardsEl.innerHTML='';
  for(const k of CHARKEYS){
    const ch=CHARS[k];
    const d=document.createElement('div');
    d.className='card'+(k===chosen?' sel':'');
    d.innerHTML='<div class="face" style="background:'+ch.col+'"></div><div class="nm">'+ch.name+
      '</div><div class="desc">'+ch.desc+'</div>';
    d.onclick=e=>{ e.stopPropagation(); chosen=k; buildMenu(); };
    cardsEl.appendChild(d);
  }
}
buildMenu();
document.getElementById('menu').addEventListener('click',()=>{
  if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
  if(AC&&AC.state==='suspended') AC.resume();
  startMatch();
});
document.getElementById('over').addEventListener('click',()=>{
  document.getElementById('over').style.display='none';
  buildMenu();
  document.getElementById('menu').style.display='flex';
  state='menu';
});

/* ============ input ============ */
const sticks={move:null,aimTouch:null};
let superBtn={x:0,y:0,r:0};
let mouse={x:0,y:0,down:false}, keys={};
function fireOf(p,ang,dist){
  if(p.ammo<1) return;
  p.ammo--; p.aim=ang;
  p.ch.fire(p,ang,dist);
}
function castSuper(p){
  if(p.super<p.ch.superNeed||!p.alive) return;
  p.super=0; sSuper();
  let ang=p.aim, dist=260;
  let best=null,bd=1e9;
  for(const q of players) if(q!==p&&q.alive&&visibleTo(p,q)){
    const d=Math.hypot(q.x-p.x,q.y-p.y); if(d<bd&&d<520){bd=d;best=q;}
  }
  if(best){ ang=Math.atan2(best.y-p.y,best.x-p.x); dist=bd; }
  p.ch.superCast(p,ang,dist);
}
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(Math.hypot(t.clientX-superBtn.x,t.clientY-superBtn.y)<superBtn.r+14){ castSuper(me); continue; }
    if(t.clientX<W*.45&&!sticks.move) sticks.move={id:t.identifier,ox:t.clientX,oy:t.clientY,dx:0,dy:0};
    else if(!sticks.aimTouch) sticks.aimTouch={id:t.identifier,ox:t.clientX,oy:t.clientY,dx:0,dy:0,t0:performance.now()};
  }
},{passive:true});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    for(const s of [sticks.move,sticks.aimTouch]) if(s&&s.id===t.identifier){
      s.dx=t.clientX-s.ox; s.dy=t.clientY-s.oy;
      const m=Math.hypot(s.dx,s.dy); if(m>60){ s.dx*=60/m; s.dy*=60/m; }
    }
  }
},{passive:true});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(sticks.move&&sticks.move.id===t.identifier) sticks.move=null;
    if(sticks.aimTouch&&sticks.aimTouch.id===t.identifier){
      const s=sticks.aimTouch; sticks.aimTouch=null;
      if(state!=='play'||!me.alive) continue;
      const m=Math.hypot(s.dx,s.dy);
      if(m<10&&performance.now()-s.t0<250){          // quick tap = auto-shot
        let best=null,bd=1e9;
        for(const q of players) if(q!==me&&q.alive&&visibleTo(me,q)&&los(me,q)){
          const d=Math.hypot(q.x-me.x,q.y-me.y); if(d<bd&&d<me.ch.range+40){bd=d;best=q;}
        }
        const ang=best?Math.atan2(best.y-me.y,best.x-me.x):me.aim;
        fireOf(me,ang,bd<1e9?bd:undefined);
      } else if(m>=10){
        fireOf(me,Math.atan2(s.dy,s.dx),m/60*me.ch.range);
      }
    }
  }
},{passive:true});
addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true;
  if(e.key===' '&&state==='play') castSuper(me); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
addEventListener('mousedown',e=>{ if(state==='play'&&me.alive){
  const ang=Math.atan2(mouse.y-H/2,mouse.x-W/2);
  fireOf(me,ang,Math.hypot(mouse.x-W/2,mouse.y-H/2)/(W/2)*me.ch.range*1.4); }});

/* ============ bot AI ============ */
function botThink(p,dt){
  const ai=p.ai;
  ai.t=(ai.t||0)-dt;
  if(ai.t<=0){
    ai.t=.15;
    ai.target=null; let bd=1e9;
    for(const q of players) if(q!==p&&q.alive&&visibleTo(p,q)&&los(p,q)){
      const d=Math.hypot(q.x-p.x,q.y-p.y);
      if(d<bd&&d<p.ch.range+80){bd=d;ai.target=q;ai.td=d;}
    }
    if(!ai.wp||Math.hypot(ai.wp.x-p.x,ai.wp.y-p.y)<60||Math.random()<.08){
      let obj=null,od=1e9;                       // objective: cube > box > center-ish wander
      for(const c of cubesArr){ const d=Math.hypot(c.x-p.x,c.y-p.y); if(d<od&&d<500){od=d;obj={x:c.x,y:c.y};} }
      if(!obj) for(const k in boxHp){ const bx=(k%MW)*TILE+24,by=(k/MW|0)*TILE+24;
        const d=Math.hypot(bx-p.x,by-p.y); if(d<od&&d<420){od=d;obj={x:bx,y:by};} }
      const m=zoneMargin+TILE*2;
      ai.wp=obj||{x:m+Math.random()*(WORLD-2*m),y:m+Math.random()*(WORLD-2*m)};
    }
    // stay inside the zone
    const m=zoneMargin+TILE*1.5;
    if(p.x<m||p.y<m||p.x>WORLD-m||p.y>WORLD-m) ai.wp={x:WORLD/2,y:WORLD/2};
  }
  let mx=0,my=0;
  const t=ai.target;
  if(t){
    p.aim=Math.atan2(t.y-p.y,t.x-p.x);
    const d=ai.td, ideal=p.ch.range*.7;
    const away=d<ideal*.6?-1:(d>ideal?1:0);
    mx=Math.cos(p.aim)*away; my=Math.sin(p.aim)*away;
    ai.orb=ai.orb||(Math.random()<.5?1:-1);
    mx+=-Math.sin(p.aim)*ai.orb*.8; my+=Math.cos(p.aim)*ai.orb*.8;
    if(p.hp<p.maxhp*.28){ mx=-Math.cos(p.aim); my=-Math.sin(p.aim); }   // flee
    ai.shoot=(ai.shoot||0)-dt;
    if(ai.shoot<=0&&p.ammo>=1){ ai.shoot=.55+Math.random()*.5; fireOf(p,p.aim+(Math.random()-.5)*.12,d); }
    if(p.super>=p.ch.superNeed&&d<p.ch.range&&Math.random()<.02) castSuper(p);
  } else if(ai.wp){
    const d=Math.hypot(ai.wp.x-p.x,ai.wp.y-p.y);
    if(d>4){ mx=(ai.wp.x-p.x)/d; my=(ai.wp.y-p.y)/d; p.aim=Math.atan2(my,mx); }
    // shoot boxes standing in the way
    const fx=p.x+Math.cos(p.aim)*60, fy=p.y+Math.sin(p.aim)*60;
    if(tile(fx/TILE|0,fy/TILE|0)===3&&p.ammo>=2){ fireOf(p,p.aim,80); }
  }
  const sp=p.ch.spd*(1+.0)*dt;
  const mm=Math.hypot(mx,my)||1;
  moveCircle(p,mx/mm*sp,my/mm*sp);
}

/* ============ update ============ */
let tPrev=performance.now();
function update(dt){
  if(state!=='play') return;
  elapsed+=dt;
  zoneT-=dt;
  if(zoneT<=0&&zoneMargin<WORLD*.36){ zoneMargin+=TILE*3; zoneT=15; if(me.alive) shake=Math.min(1,shake+.3); }

  for(const p of players){
    if(!p.alive) continue;
    p.shotT-=dt; p.hurtT-=dt;
    p.regenT=(p.regenT||0)+dt;
    if(p.regenT>4&&p.hp<p.maxhp) p.hp=Math.min(p.maxhp,p.hp+900*dt);
    p.reload+=dt;
    if(p.ammo<3&&p.reload>=p.ch.ammoT){ p.ammo++; p.reload=0; }
    // leap (Buck super)
    if(p.leap){
      p.leap.t-=dt;
      const k=1-Math.max(0,p.leap.t)/.45;
      p.x=p.leap.sx+(p.leap.tx-p.leap.sx)*k; p.y=p.leap.sy+(p.leap.ty-p.leap.sy)*k;
      p.x=Math.max(TILE+20,Math.min(WORLD-TILE-20,p.x));
      p.y=Math.max(TILE+20,Math.min(WORLD-TILE-20,p.y));
      if(p.leap.t<=0){
        if(wallAt(p.x,p.y)){ map[(p.y/TILE|0)*MW+(p.x/TILE|0)]=0; }   // smash what you land on
        explosions.push({x:p.x,y:p.y,t:.3,r:110,dmg:1400*(1+.08*p.cubes),owner:p,boom:true});
        p.leap=null;
      }
      continue;
    }
    if(p.bot) botThink(p,dt);
    else {
      let mx=0,my=0;
      if(sticks.move){ mx=sticks.move.dx; my=sticks.move.dy; }
      if(keys.w)my-=1; if(keys.s)my+=1; if(keys.a)mx-=1; if(keys.d)mx+=1;
      const m=Math.hypot(mx,my);
      if(m>4||((keys.w||keys.a||keys.s||keys.d)&&m>0)){
        const sp=p.ch.spd*dt; moveCircle(p,mx/m*sp,my/m*sp);
        if(!sticks.aimTouch) p.aim=Math.atan2(my,mx);
      }
      if(sticks.aimTouch&&Math.hypot(sticks.aimTouch.dx,sticks.aimTouch.dy)>10)
        p.aim=Math.atan2(sticks.aimTouch.dy,sticks.aimTouch.dx);
    }
    // poison zone
    if(p.x<zoneMargin||p.y<zoneMargin||p.x>WORLD-zoneMargin||p.y>WORLD-zoneMargin)
      { p.zoneT=(p.zoneT||0)+dt; if(p.zoneT>.5){ p.zoneT=0; damage(p,600,null); } }
    // cube pickup
    for(let i=cubesArr.length-1;i>=0;i--){
      const c=cubesArr[i];
      if(Math.hypot(c.x-p.x,c.y-p.y)<30){
        cubesArr.splice(i,1); p.cubes++; p.maxhp+=400; p.hp+=400;
        if(p===me)sCube();
        pops.push({x:p.x,y:p.y-30,t:.8,txt:'+CUBE',col:'#c76bff'});
      }
    }
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    const step=Math.hypot(b.vx,b.vy)*dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.d+=step;
    const txy=(b.y/TILE|0)*MW+(b.x/TILE|0), tt=tile(b.x/TILE|0,b.y/TILE|0);
    let dead=b.d>b.range;
    if(tt===1&&!b.pierce) dead=true;
    if(tt===3){ hitBox(txy,b.dmg); if(!b.pierce) dead=true; }
    if(!dead) for(const p of players){
      if(p===b.owner||!p.alive) continue;
      if(Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){
        damage(p,b.dmg,b.owner);
        if(!b.pierce){ dead=true; break; }
      }
    }
    if(dead) bullets.splice(i,1);
  }
  // lobs
  for(let i=lobs.length-1;i>=0;i--){
    const l=lobs[i]; l.t+=dt;
    if(l.t>=l.air){
      explosions.push({x:l.tx,y:l.ty,t:.3,r:l.rad,dmg:l.dmg,owner:l.owner,boom:true});
      lobs.splice(i,1);
    }
  }
  // explosions
  for(let i=explosions.length-1;i>=0;i--){
    const ex=explosions[i];
    if(ex.boom){
      ex.boom=false; sBoom(); if(me.alive&&Math.hypot(ex.x-me.x,ex.y-me.y)<300) shake=Math.min(1,shake+.4);
      for(const p of players) if(p.alive&&p!==ex.owner&&Math.hypot(p.x-ex.x,p.y-ex.y)<ex.r+p.r)
        damage(p,ex.dmg,ex.owner);
      const tx=ex.x/TILE|0, ty=ex.y/TILE|0;      // blow up boxes in radius
      for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++)
        if(tile(tx+k,ty+j)===3) hitBox((ty+j)*MW+tx+k,ex.dmg);
    }
    ex.t-=dt; if(ex.t<=0) explosions.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){ pops[i].t-=dt; pops[i].y-=30*dt; if(pops[i].t<=0)pops.splice(i,1); }
  for(let i=fxs.length-1;i>=0;i--){ fxs[i].t-=dt; if(fxs[i].t<=0)fxs.splice(i,1); }
  shake=Math.max(0,shake-dt*2);
}

/* ============ render ============ */
function draw(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle='#3f7f4c'; cx.fillRect(0,0,W,H);
  if(!me) return;
  const camx=me.x-W/2+(Math.random()-.5)*shake*10, camy=me.y-H/2+(Math.random()-.5)*shake*10;
  cx.save(); cx.translate(-camx,-camy);

  const x0=Math.max(0,camx/TILE|0), y0=Math.max(0,camy/TILE|0),
        x1=Math.min(MW-1,(camx+W)/TILE+1|0), y1=Math.min(MH-1,(camy+H)/TILE+1|0);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const t=map[ty*MW+tx], X=tx*TILE, Y=ty*TILE;
    cx.fillStyle=(tx+ty)%2?'#478a54':'#4d925b'; cx.fillRect(X,Y,TILE,TILE);
    if(t===1){ cx.fillStyle='#5b6270'; cx.fillRect(X+2,Y+2,TILE-4,TILE-4);
      cx.fillStyle='#6d7484'; cx.fillRect(X+6,Y+6,TILE-16,TILE-16); }
    else if(t===3){ cx.fillStyle='#8a6134'; cx.fillRect(X+5,Y+5,TILE-10,TILE-10);
      cx.strokeStyle='#5e401f'; cx.lineWidth=3; cx.strokeRect(X+5,Y+5,TILE-10,TILE-10);
      cx.beginPath(); cx.moveTo(X+5,Y+5); cx.lineTo(X+TILE-5,Y+TILE-5); cx.stroke(); }
  }
  // cubes
  for(const c of cubesArr){
    cx.fillStyle='#c76bff'; cx.save(); cx.translate(c.x,c.y);
    cx.rotate(performance.now()*.002); cx.fillRect(-9,-9,18,18);
    cx.fillStyle='#e6b3ff'; cx.fillRect(-5,-5,10,10); cx.restore();
  }
  // lob shadows
  for(const l of lobs){
    const k=l.t/l.air;
    cx.globalAlpha=.35; cx.fillStyle='#000';
    cx.beginPath(); cx.arc(l.tx,l.ty,l.rad*k,0,7); cx.fill(); cx.globalAlpha=1;
    const px=l.x+(l.tx-l.x)*k, py=l.y+(l.ty-l.y)*k-Math.sin(k*Math.PI)*90;
    cx.fillStyle='#2c2c2c'; cx.beginPath(); cx.arc(px,py,8,0,7); cx.fill();
  }
  // players
  for(const p of players){
    if(!p.alive||!visibleTo(me,p)) continue;
    const hidden=inBush(p);
    cx.globalAlpha=hidden?(p===me?.55:.35):1;
    cx.fillStyle='rgba(0,0,0,.3)'; cx.beginPath(); cx.ellipse(p.x,p.y+14,15,7,0,0,7); cx.fill();
    cx.fillStyle=p.ch.col; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill();
    cx.strokeStyle=p===me?'#fff':'rgba(0,0,0,.4)'; cx.lineWidth=3; cx.stroke();
    cx.strokeStyle='#20242e'; cx.lineWidth=6;      // weapon
    cx.beginPath(); cx.moveTo(p.x,p.y);
    cx.lineTo(p.x+Math.cos(p.aim)*30,p.y+Math.sin(p.aim)*30); cx.stroke();
    cx.fillStyle='#ffe0c2'; cx.beginPath(); cx.arc(p.x,p.y-4,9,0,7); cx.fill();  // head
    // hp bar + name
    const bw=46;
    cx.fillStyle='rgba(0,0,0,.55)'; cx.fillRect(p.x-bw/2,p.y-40,bw,7);
    cx.fillStyle=p===me?'#6cff8e':'#ff5d5d';
    cx.fillRect(p.x-bw/2,p.y-40,bw*Math.max(0,p.hp/p.maxhp),7);
    cx.font='800 11px sans-serif'; cx.textAlign='center';
    cx.fillStyle='#fff'; cx.fillText(p.name+(p.cubes?' ▣'+p.cubes:''),p.x,p.y-46);
    cx.globalAlpha=1;
  }
  // bullets
  for(const b of bullets){
    cx.fillStyle=b.col; cx.beginPath(); cx.arc(b.x,b.y,b.r,0,7); cx.fill();
  }
  // bush cover (drawn over players so hiding in them works visually)
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(map[ty*MW+tx]!==2) continue;
    const X=tx*TILE, Y=ty*TILE;
    cx.globalAlpha=.92; cx.fillStyle='#2e6b38'; cx.fillRect(X,Y,TILE,TILE);
    cx.fillStyle='#398046';
    cx.beginPath(); cx.arc(X+14,Y+16,10,0,7); cx.arc(X+34,Y+28,12,0,7);
    cx.arc(X+20,Y+38,9,0,7); cx.fill();
    cx.globalAlpha=1;
  }
  // explosions & fx
  for(const ex of explosions){
    cx.globalAlpha=Math.max(0,ex.t/.3)*.7; cx.fillStyle='#ffb054';
    cx.beginPath(); cx.arc(ex.x,ex.y,ex.r*(1.2-ex.t/.3*.4),0,7); cx.fill(); cx.globalAlpha=1;
  }
  for(const f of fxs){
    cx.globalAlpha=f.t; cx.strokeStyle=f.col; cx.lineWidth=5;
    cx.beginPath(); cx.arc(f.x,f.y,f.r*(1.4-f.t),0,7); cx.stroke(); cx.globalAlpha=1;
  }
  // poison zone
  if(zoneMargin>0){
    cx.fillStyle='rgba(180,60,220,.28)';
    cx.fillRect(0,0,WORLD,zoneMargin); cx.fillRect(0,WORLD-zoneMargin,WORLD,zoneMargin);
    cx.fillRect(0,zoneMargin,zoneMargin,WORLD-2*zoneMargin);
    cx.fillRect(WORLD-zoneMargin,zoneMargin,zoneMargin,WORLD-2*zoneMargin);
    cx.strokeStyle='#c76bff'; cx.lineWidth=4;
    cx.strokeRect(zoneMargin,zoneMargin,WORLD-2*zoneMargin,WORLD-2*zoneMargin);
  }
  // damage pops
  for(const d of pops){
    cx.globalAlpha=Math.min(1,d.t*2); cx.font='900 16px sans-serif'; cx.textAlign='center';
    cx.fillStyle=d.col; cx.fillText(d.txt,d.x,d.y); cx.globalAlpha=1;
  }
  cx.restore();

  /* ---- HUD ---- */
  if(state==='play'){
    const alive=players.filter(p=>p.alive).length;
    cx.font='900 20px sans-serif'; cx.textAlign='left'; cx.fillStyle='#fff';
    cx.fillText('⚔ '+alive+' left',16,32);
    cx.fillStyle='#c76bff'; cx.fillText('▣ '+me.cubes,16,58);
    cx.fillStyle='#ffd11a'; cx.textAlign='right'; cx.fillText('🏆 '+trophies,W-16,32);
    // ammo pips
    for(let i=0;i<3;i++){
      cx.fillStyle=i<me.ammo?'#ffd11a':'rgba(255,255,255,.25)';
      cx.fillRect(W/2-36+i*26,H-26,20,10);
    }
    // move stick
    if(sticks.move){
      cx.globalAlpha=.35; cx.fillStyle='#fff';
      cx.beginPath(); cx.arc(sticks.move.ox,sticks.move.oy,52,0,7); cx.fill();
      cx.globalAlpha=.6;
      cx.beginPath(); cx.arc(sticks.move.ox+sticks.move.dx,sticks.move.oy+sticks.move.dy,26,0,7); cx.fill();
      cx.globalAlpha=1;
    }
    // aim line
    if(sticks.aimTouch&&Math.hypot(sticks.aimTouch.dx,sticks.aimTouch.dy)>10&&me.alive){
      const a=Math.atan2(sticks.aimTouch.dy,sticks.aimTouch.dx);
      cx.globalAlpha=.4; cx.strokeStyle='#fff'; cx.lineWidth=3; cx.setLineDash([10,8]);
      cx.beginPath(); cx.moveTo(W/2,H/2);
      cx.lineTo(W/2+Math.cos(a)*me.ch.range*.6,H/2+Math.sin(a)*me.ch.range*.6);
      cx.stroke(); cx.setLineDash([]); cx.globalAlpha=1;
    }
    // super button
    superBtn={x:W-74,y:H-74,r:44};
    const ready=me.super>=me.ch.superNeed;
    cx.globalAlpha=.9;
    cx.fillStyle=ready?'#ffd11a':'rgba(40,46,62,.8)';
    cx.beginPath(); cx.arc(superBtn.x,superBtn.y,superBtn.r,0,7); cx.fill();
    cx.strokeStyle='#fff'; cx.lineWidth=4;
    cx.beginPath();
    cx.arc(superBtn.x,superBtn.y,superBtn.r-2,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,me.super/me.ch.superNeed));
    cx.stroke();
    cx.fillStyle=ready?'#5e410c':'#cfd6e4'; cx.font='900 14px sans-serif'; cx.textAlign='center';
    cx.fillText('SUPER',superBtn.x,superBtn.y+5); cx.globalAlpha=1;
    // zone warning
    if(zoneT<4&&zoneMargin<WORLD*.36){
      cx.fillStyle='#c76bff'; cx.font='900 17px sans-serif'; cx.textAlign='center';
      cx.fillText('⚠ POISON CLOUDS CLOSING IN '+Math.ceil(zoneT)+'s',W/2,58);
    }
  }
}

function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(t-tPrev)/1000); tPrev=t;
  update(dt); draw();
}
requestAnimationFrame(frame);
</script>
</body>
