  #c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:auto}

  #hp i.off{background:#333;box-shadow:none}
  #pie{position:absolute;left:50%;top:10px;width:64px;height:64px;margin-left:-32px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #000}

<script>
'use strict';
// ======================= setup =======================
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const V3 = THREE.Vector3;
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 900);
function resize() { const RH = isTouch ? 270 : 320; renderer.setSize(Math.round(RH * innerWidth / innerHeight), RH, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerpAngle = (a, b, t) => { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; };
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
let SENS = parseFloat(store('ph3_sens')) || 1;
const MAXANI = renderer.capabilities.getMaxAnisotropy();

// film grain overlay
(function grain() { return;
  const g = $('grain').getContext('2d'), img = g.createImageData(128, 128);
  const tick = () => { for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0); $('grain').style.transform = `translate(${rand(-10, 10)}%,${rand(-10, 10)}%) scale(8)`; };
  $('grain').style.imageRendering = 'pixelated'; setInterval(tick, 70); tick();
})();

// ======================= audio =======================
let AC = null, NOISE = null;
function ac() {
  if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); const n = AC.sampleRate;
    NOISE = AC.createBuffer(1, n, n); const d = NOISE.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  if (AC.state === 'suspended') AC.resume(); return AC;
}
function noise(dur, freq, vol) { try { const a = ac(), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = NOISE; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.15), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur); } catch (e) {} }
function tone(f, d, type = 'square', slide = 0, vol = 0.05) { try { const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d); } catch (e) {} }
// ---- original background music (hub, 4 courses, boss) ----
const music = (() => {
  const SONGS = [
    { bpm: 126, lead: [76,0,79,0,84,0,83,81, 79,0,76,0,77,79,0,0, 74,0,77,0,81,0,79,77, 76,0,72,0,74,0,0,0], bass: [48,0,55,0,52,0,55,0, 53,0,57,0,48,0,55,0, 50,0,57,0,53,0,57,0, 55,0,59,0,43,0,47,0], chord: [[60,64,67],[65,69,72],[62,65,69],[67,71,74]] },
    { bpm: 104, lead: [69,0,0,72,71,0,69,0, 64,0,0,0,65,64,62,0, 69,0,0,72,74,0,76,0, 74,72,71,0,69,0,0,0], bass: [45,0,45,0,45,0,52,0, 41,0,41,0,41,0,48,0, 43,0,43,0,43,0,50,0, 40,0,40,0,44,0,40,0], chord: [[57,60,64],[53,57,60],[55,59,62],[52,56,59]] },
    { bpm: 138, lead: [79,0,78,79,0,83,0,79, 81,0,79,78,76,0,74,0, 76,0,78,79,0,81,0,83, 84,0,83,81,79,0,0,0], bass: [43,0,50,0,55,0,50,0, 45,0,52,0,57,0,52,0, 47,0,54,0,59,0,54,0, 48,0,55,0,50,0,57,0], chord: [[55,59,62],[57,60,64],[59,62,66],[60,64,67]] },
    { bpm: 96, lead: [81,0,0,0,79,0,76,0, 74,0,0,0,76,0,0,0, 72,0,0,0,74,0,76,0, 79,0,0,0,76,0,0,0], bass: [45,0,0,0,52,0,0,0, 41,0,0,0,48,0,0,0, 43,0,0,0,50,0,0,0, 40,0,0,0,47,0,0,0], chord: [[69,72,76],[65,69,72],[67,71,74],[64,67,71]] },
    { bpm: 152, lead: [64,0,64,67,0,64,70,0, 69,0,67,0,64,0,63,0, 64,0,64,67,0,64,70,0, 72,0,71,0,70,0,69,0], bass: [40,40,0,40,40,0,40,0, 41,41,0,41,41,0,41,0, 40,40,0,40,40,0,40,0, 38,38,0,38,39,0,39,0], chord: [[52,55,59],[53,56,60],[52,55,59],[50,53,57]] },
  ];
  let on = false, song = 0, step = 0, next = 0, out = null;
  const f = m => 440 * Math.pow(2, (m - 69) / 12);
  function note(t, m, d, type, v) { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f(m);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.setValueAtTime(v, t + d * 0.6); g.gain.linearRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + d + 0.02); }
  setInterval(() => {
    if (!on || !AC) return;
    const sg = SONGS[song], sd = 60 / sg.bpm / 4;
    while (next < AC.currentTime + 0.2) {
      const i = step % 32, L = sg.lead[i], B = sg.bass[i];
      if (L) note(next, L, sd * 1.7, 'triangle', 0.09);
      if (L && song !== 3) note(next, L + 12, sd * 0.9, 'square', 0.012);
      if (B) note(next, B, sd * 1.8, 'triangle', 0.13);
      if (i % 8 === 0) for (const m of sg.chord[(i / 8) | 0]) note(next, m, sd * 7.5, 'sine', 0.025);
      if (i % 4 === 0 && song !== 3) { try { const s2 = AC.createBufferSource(), g2 = AC.createGain(), fl = AC.createBiquadFilter(); s2.buffer = NOISE; fl.type = 'highpass'; fl.frequency.value = 6000;
        g2.gain.setValueAtTime(0.05, next); g2.gain.exponentialRampToValueAtTime(0.001, next + 0.05); s2.connect(fl); fl.connect(g2); g2.connect(out); s2.start(next, Math.random()); s2.stop(next + 0.06); } catch (e) {} }
      next += sd; step++;
    }
  }, 30);
  return {
    play(i) { try { ac(); if (!out) { out = AC.createGain(); out.gain.value = 0.8; out.connect(AC.destination); } if (on && song === i) return; song = i; step = 0; next = AC.currentTime + 0.1; on = true; } catch (e) {} },
    stop() { on = false; },
  };
})();
const SFX = {
  jump: n => tone([330, 400, 500][n], 0.2, 'square', 500 + n * 200, 0.05),
  coin: () => { tone(988, 0.07, 'square', 0, 0.04); setTimeout(() => tone(1319, 0.25, 'square', 0, 0.04), 60); },
  stomp: () => { noise(0.15, 1200, 0.25); tone(200, 0.15, 'triangle', -120, 0.15); },
  bump: () => tone(140, 0.1, 'triangle', 0, 0.15),
  brk: () => noise(0.35, 2500, 0.3),
  hurt: () => { noise(0.2, 900, 0.3); tone(220, 0.3, 'sawtooth', -150, 0.08); },
  pound: () => { noise(0.4, 500, 0.5); tone(70, 0.3, 'sine', -30, 0.4); },
  land: () => noise(0.06, 500, 0.08),
  flag: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'square', 0, 0.04), i * 90)),
  die: () => [494, 440, 392, 330].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'square', 0, 0.05), i * 170)),
  warp: () => { tone(80, 2.5, 'sawtooth', 900, 0.06); noise(2.5, 300, 0.2); },
  oneup: () => [659, 784, 1319, 1046, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'square', 0, 0.04), i * 80)),
};

// ======================= planets (muted, gritty palettes) =======================
const PLANETS = [
  { name: 'GRASSY PEAKS', grav: 1, fric: 11, skyTop: 0x2a64d8, skyHz: 0xb8e0ff, fog: 0xb8e0ff, fogN: 60, fogF: 260, sun: 0xffffff, hemiG: 0x507030,
    top: [60, 190, 50], top2: [40, 150, 40], stone: [200, 170, 120], stone2: [150, 120, 80], metal: [150, 150, 170], moon: 0xffffff, enemy: [0x8a4a20, 0xd09060], eye: 0xffffff, tip: 'COURSE 1', req: 0 },
  { name: 'LAVA LAGOON', grav: 1.05, fric: 11, skyTop: 0x401010, skyHz: 0xff8040, fog: 0xa04020, fogN: 40, fogF: 200, sun: 0xffd0a0, hemiG: 0x401010,
    top: [110, 90, 90], top2: [80, 60, 60], stone: [140, 100, 90], stone2: [100, 60, 50], metal: [120, 110, 110], moon: 0xffa040, enemy: [0x303030, 0x707070], eye: 0xffe040, lava: true, tip: 'COURSE 2', req: 1 },
  { name: 'FROSTY SLIDES', grav: 0.95, fric: 1.8, skyTop: 0x5080d0, skyHz: 0xe8f4ff, fog: 0xe0f0ff, fogN: 40, fogF: 200, sun: 0xffffff, hemiG: 0x8090b0,
    top: [240, 248, 255], top2: [200, 220, 240], stone: [150, 180, 220], stone2: [110, 140, 190], metal: [160, 170, 190], moon: 0xffffff, enemy: [0x3050c0, 0x90b0ff], eye: 0xffffff, tip: 'COURSE 3 - SLIPPERY!', req: 2 },
  { name: 'STARRY SKYWAY', grav: 0.6, fric: 11, skyTop: 0x080420, skyHz: 0x503090, fog: 0x302060, fogN: 40, fogF: 220, sun: 0xfff0ff, hemiG: 0x301050,
    top: [200, 120, 230], top2: [150, 80, 190], stone: [120, 110, 170], stone2: [80, 70, 130], metal: [130, 120, 170], moon: 0xffe080, enemy: [0x20b060, 0x80f0b0], eye: 0xff40ff, rings: true, tip: 'COURSE 4 - LOW GRAVITY', req: 3 },
];
const HUB = { name: 'STAR CASTLE', grav: 1, fric: 11, skyTop: 0x2a64d8, skyHz: 0xc8e8ff, fog: 0xc8e8ff, fogN: 80, fogF: 320, sun: 0xffffff, hemiG: 0x507030,
  top: [70, 200, 60], top2: [50, 160, 45], stone: [230, 215, 180], stone2: [190, 170, 130], metal: [150, 150, 170], moon: 0xffffff, enemy: [0x8a4a20, 0xd09060], eye: 0xffffff, tip: 'COLLECT POWER STARS', hub: true };
const starsGot = (() => { try { return JSON.parse(localStorage.getItem('sh64_stars') || '[]'); } catch (e) { return []; } })();
const starCount = () => starsGot.filter(Boolean).length;
function saveStars() { try { localStorage.setItem('sh64_stars', JSON.stringify(starsGot)); } catch (e) {} }


// ======================= procedural "photo-ish" textures =======================
function mkR(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function vnoise(size, cells, R) {
  const lat = new Float32Array(cells * cells); for (let i = 0; i < lat.length; i++) lat[i] = R();
  const out = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const fx = x / size * cells, fy = y / size * cells, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const a = lat[(iy % cells) * cells + ix % cells], b = lat[(iy % cells) * cells + (ix + 1) % cells];
    const c = lat[((iy + 1) % cells) * cells + ix % cells], d = lat[((iy + 1) % cells) * cells + (ix + 1) % cells];
    out[y * size + x] = (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  }
  return out;
}
function fbm(size, R, octs = [[4, 0.45], [8, 0.25], [16, 0.15], [32, 0.1], [64, 0.05]]) {
  const out = new Float32Array(size * size);
  for (const [c, w] of octs) { const n = vnoise(size, c, R); for (let i = 0; i < out.length; i++) out[i] += n[i] * w; }
  return out;
}
function makeTex(size, fn) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) { const [r, gg, b] = fn(x, y), i = (y * size + x) * 4;
    img.data[i] = clamp(r, 0, 255); img.data[i + 1] = clamp(gg, 0, 255); img.data[i + 2] = clamp(b, 0, 255); img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI; return { tex: t, canvas: c, g };
}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
function buildTextures(P, seed) {
  const R = mkR(seed), S = 64;
  const n1 = fbm(S, R), n2 = fbm(S, R, [[16, 0.5], [32, 0.3], [64, 0.2]]), n3 = vnoise(S, 8, R);
  // ground top: dirt/grass/snow/ash with clumps, pebbles, cracks
  const top = makeTex(S, (x, y) => {
    const i = y * S + x, v = n1[i], d = n2[i];
    let c = mix(P.top2, P.top, clamp((v - 0.35) * 2.5, 0, 1));
    c = mul(c, 0.78 + d * 0.45);
    if (n3[i] > 0.72) c = mix(c, mul(P.stone2, 0.9), 0.55);
    if (R() < 0.04) c = mul(c, R() < 0.5 ? 0.7 : 1.2);
    if (P.lava) { const cr = Math.abs(v - 0.5); if (cr < 0.012) c = [255, 120 + d * 80, 20]; else if (cr < 0.025) c = mix(c, [120, 30, 10], 0.6); }
    return c;
  });
  // stone block wall
  const rows = 6, rowH = S / rows, bw = [];
  for (let r = 0; r < rows; r++) { const arr = []; let x = -R() * 10; while (x < S) { const w = 10 + R() * 14; arr.push([x, w, 0.8 + R() * 0.35]); x += w; } bw.push(arr); }
  const stone = makeTex(S, (x, y) => {
    const i = y * S + x, r = Math.floor(y / rowH), ly = y - r * rowH;
    let blk = bw[r][0]; for (const b of bw[r]) if (x >= b[0] && x < b[0] + b[1]) blk = b; else if (x + S >= b[0] && x + S < b[0] + b[1]) blk = b;
    const lx = ((x - blk[0]) % S + S) % S;
    let c = mix(P.stone2, P.stone, n1[i]); c = mul(c, blk[2] * (0.75 + n2[i] * 0.45));
    if (ly < 1 || lx < 1) c = mul(c, 0.45);               // mortar
    else if (ly < 2 || lx < 2) c = mul(c, 1.18);          // chipped highlight edge
    else if (ly > rowH - 6) c = mul(c, 0.8);              // bottom shade
    c = mul(c, 0.85 + (1 - y / S) * 0.1 + (n3[i] > 0.7 ? -0.15 : 0));   // grime streaks
    return c;
  });
  // rusted metal panels
  const metal = makeTex(S, (x, y) => {
    const i = y * S + x, px = x % 128, py = y % 128;

function updateBoss(dt) {

  if (inArena && !b.met) { b.met = true; centerMsg(b.def.name, 'STOMP IT 3 TIMES!'); music.play(4); }
  $('bosshp').innerHTML = `<i style="width:${b.hp / b.maxHp * 100}%"></i>`;

      const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.18, 6, 32), new THREE.MeshBasicMaterial({ color: 0xffe080, transparent: true, opacity: 0.9 }));
      ring.rotation.x = Math.PI / 2; ring.position.copy(b.pos).setY(b.pos.y + 0.25); level.add(ring); shock.push({ m: ring, r: 1, hit: false }); }
  } else if (b.st === 'stun') { b.stars.visible = true; b.stars.rotation.y += dt * 6; if (b.t <= 0) { b.st = 'walk'; b.t = 1.5; b.stars.visible = false; } }

    H.arms[0].rotation.x = -2.8; H.arms[0].rotation.z = 0.2; H.arms[1].rotation.x = 0.6;
    if (pl.jumpN === 2) H.g.rotation.x = -((pl.vel.y > 0 ? 1 - pl.vel.y / 15 : 1)) * Math.PI * 2 * (pl.vel.y > 0 ? 1 : 0);
  }
  // blob shadow on highest surface below
  let top = -1e9; for (const b of boxes) if (pl.pos.x > b.min.x && pl.pos.x < b.max.x && pl.pos.z > b.min.z && pl.pos.z < b.max.z && b.max.y <= pl.pos.y + 0.05 && b.max.y > top) top = b.max.y;
  blob.visible = top > -1e8; blob.position.set(pl.pos.x, top + 0.03, pl.pos.z);
  const h = pl.pos.y - top; blob.scale.setScalar(clamp(1 - h / 14, 0.35, 1)); blob.material.opacity = clamp(0.5 - h / 30, 0.15, 0.5);
}
function updateWorld(dt, t) {
  for (const c of clouds) c.rotation.y += dt * 0.01, c.position.x += Math.sin(t * 0.05 + c.position.z) * dt * 0.8;
  if (waterTex && P && P.hub) { waterTex.offset.x = t * 0.02; waterTex.offset.y = Math.sin(t * 0.3) * 0.05; }
  for (const mv of movers) placeMover(mv, dt);
  for (const b of boxes) if (b.bump > 0) { b.bump = Math.max(0, b.bump - dt * 5); b.mesh.position.y = b.baseY + Math.sin(b.bump * Math.PI) * 0.35; }
  for (const c of coins) if (c.alive) c.m.rotation.y = t * 3;
  for (const f of flags) if (f.g.userData.star) { f.g.userData.star.rotation.y = t * 2.5; f.g.userData.star.position.y = 2.2 + Math.sin(t * 2) * 0.25; }
  for (const f of flags) if (f.g.userData.cloth) { const pos = f.g.userData.cloth.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) { const x = pos.getX(i) + 0.7; pos.setZ(i, Math.sin(t * 5 + x * 3) * 0.12 * x); } pos.needsUpdate = true; }
  for (const e of enemies) {
    const g = e.a.g;
    if (!e.alive) { e.dieT += dt; g.scale.set(1 + e.dieT * 2, Math.max(0.05, 1 - e.dieT * 8), 1 + e.dieT * 2); if (e.dieT > 0.5) { g.visible = false; } continue; }
    e.pos[e.axis] += e.dir * e.speed * dt; if (e.pos[e.axis] > e.hi) e.dir = -1; if (e.pos[e.axis] < e.lo) e.dir = 1;
    // chase if player close on same platform
    const toP = player.pos[e.axis] - e.pos[e.axis];
    if (Math.abs(player.pos.y - e.pos.y) < 1 && player.pos.distanceTo(e.pos) < 6) e.dir = Math.sign(toP) || e.dir;
    e.walk += dt * e.speed * 4;
    g.position.set(e.pos.x, e.pos.y + Math.abs(Math.sin(e.walk)) * 0.08, e.pos.z);
    g.rotation.y = e.axis === 'x' ? (e.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (e.dir > 0 ? 0 : Math.PI);
    e.a.legs[0].rotation.x = Math.sin(e.walk) * 0.7; e.a.legs[1].rotation.x = -Math.sin(e.walk) * 0.7;
  }
  parts = parts.filter(p => { p.life -= dt; p.v.y -= p.g * dt; p.m.position.addScaledVector(p.v, dt);
    if (p.spin) p.m.rotation.z += dt * 20; if (p.tumble) { p.m.rotation.x += dt * 8; p.m.rotation.y += dt * 6; }
    if (p.fade) { p.m.material.opacity = Math.max(0, p.life); p.m.scale.multiplyScalar(1 + dt * 1.5); }
    if (p.life <= 0) { scene.remove(p.m); return false; } return true; });
}
function updateCamera(dt) {
  const tgt = new V3(player.pos.x, player.pos.y + 1.4, player.pos.z);
  cam.look.lerp(tgt, 1 - Math.exp(-dt * 10));
  const cp = Math.cos(cam.pitch), off = new V3(Math.sin(cam.yaw) * cp, Math.sin(cam.pitch), Math.cos(cam.yaw) * cp).multiplyScalar(cam.dist);
  // pull the camera in front of any platform that would block the view of the player
  let k = 1;
  for (let s = 0.08; s <= 1; s += 0.04) {
    const q = cam.look.clone().addScaledVector(off, s);
    if (boxes.some(b => q.x > b.min.x - 0.3 && q.x < b.max.x + 0.3 && q.y > b.min.y - 0.3 && q.y < b.max.y + 0.3 && q.z > b.min.z - 0.3 && q.z < b.max.z + 0.3)) { k = Math.max(0.12, s - 0.06); break; }
  }
  cam.k = (cam.k || 1) + (k - (cam.k || 1)) * (k < (cam.k || 1) ? 1 : Math.min(1, dt * 3));
  cam.pos.copy(cam.look).addScaledVector(off, cam.k);
  camera.position.copy(cam.pos);
  shake = Math.max(0, shake - dt); if (shake) camera.position.add(new V3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * 0.3));
  camera.lookAt(cam.look);
  sun.position.set(player.pos.x - 30, player.pos.y + 60, player.pos.z - 20); sun.target.position.copy(player.pos);
  sky.position.copy(camera.position);
}

// ======================= HUD & flow =======================
let popT = 0, centerT = 0;
function pop(s) { $('pop').textContent = s; popT = 1.3; }
function centerMsg(a, b) { $('center').innerHTML = a + (b ? `<small>${b}</small>` : ''); centerT = 3; }
function updateHud(dt) {
  const hp = clamp(player.hp, 0, 8), col = hp > 5 ? '#3c8cff' : hp > 3 ? '#30d050' : hp > 1 ? '#ffd020' : '#ff3030';
  $('pie').style.background = `conic-gradient(${col} 0 ${hp / 8 * 100}%, #222 ${hp / 8 * 100}% 100%)`; $('pien').textContent = hp;
  $('sn').textContent = starCount();
  $('cn').textContent = coinCount; $('lives').textContent = 'LIVES x' + lives;
  $('right').innerHTML = `${P.hub ? 'HUB' : 'COURSE ' + (levelIdx + 1)}<br><big>${P.name}</big><br>SCORE ${score}`;
  popT -= dt; $('pop').style.opacity = clamp(popT, 0, 1);
  centerT -= dt; $('center').style.opacity = clamp(centerT, 0, 1);
  const h = $('hurt'); h.style.opacity = Math.max(0, parseFloat(h.style.opacity || 0) - dt * 1.5);
}
const menu = $('menu');
function showMenu(html) { menu.innerHTML = html; menu.style.display = 'flex'; $('hud').style.display = 'none'; $('touch').style.display = 'none'; if (document.exitPointerLock && document.pointerLockElement) document.exitPointerLock(); }
function hideMenu() { menu.style.display = 'none'; $('hud').style.display = 'block'; $('touch').style.display = isTouch ? 'block' : 'none'; }
const sensHtml = () => `<label>CAMERA SENSITIVITY <input id="sens" type="range" min="0.3" max="2.5" step="0.1" value="${SENS}"> <span id="sensv">${SENS.toFixed(1)}</span></label>`;
function bindSens() { const s = $('sens'); if (s) s.oninput = () => { SENS = parseFloat(s.value); $('sensv').textContent = SENS.toFixed(1); store('ph3_sens', SENS); }; }
const controlsHtml = isTouch
  ? '<p>LEFT THUMB: RUN &nbsp;|&nbsp; RIGHT THUMB: CAMERA &nbsp;|&nbsp; JUMP x3 ON LANDING = TRIPLE JUMP<br>HOLD Z + JUMP WHILE RUNNING = LONG JUMP &nbsp;|&nbsp; HOLD Z + JUMP STANDING = BACKFLIP<br>JUMP INTO A WALL, THEN JUMP AGAIN = WALL KICK &nbsp;|&nbsp; Z IN MID-AIR = GROUND POUND</p>'
  : '<p>WASD RUN &nbsp;|&nbsp; MOUSE / Q E CAMERA &nbsp;|&nbsp; SPACE JUMP (CHAIN 3 = TRIPLE JUMP)<br>SHIFT + JUMP RUNNING = LONG JUMP &nbsp;|&nbsp; SHIFT + JUMP STANDING = BACKFLIP<br>JUMP INTO A WALL THEN JUMP = WALL KICK &nbsp;|&nbsp; SHIFT IN AIR = GROUND POUND &nbsp;|&nbsp; GAMEPAD OK</p>';
function titleMenu() {
  state = 'menu';
  showMenu(`<h1 style="color:#ffd020;text-shadow:4px 4px 0 #a02000">STAR HOPPER <span style="color:#40a0ff">64</span></h1><h2 style="color:#fff">POWER STARS: ${starCount()} / ${PLANETS.length}</h2>
    <p>JUMP INTO THE CASTLE PAINTINGS, FIND THE POWER STAR IN EACH COURSE, AND OPEN THE BIG DOOR.</p>${controlsHtml}
    <button id="go">PLAY</button>${starCount() ? '<button id="reset">NEW GAME</button>' : ''}${sensHtml()}`);
  bindSens(); $('go').onclick = () => { ac(); score = 0; coinCount = 0; lives = 4; levelIdx = -1; startLevel(); };
  if ($('reset')) $('reset').onclick = () => { starsGot.length = 0; saveStars(); titleMenu(); };
}
function startLevel() { buildLevel(); hideMenu(); state = 'play'; music.play(areaSong()); lockPointer(); centerMsg(P.name, P.hub ? `POWER STARS ${starCount()} / ${PLANETS.length}` : P.tip); last = performance.now(); }
function pause() {
  if (state !== 'play') return; state = 'pause';
  showMenu(`<h1>PAUSED</h1><h2>${P.name} - \u2605 ${starCount()}</h2>${controlsHtml}<button id="rs">RESUME</button>${P.hub ? '' : '<button id="ex">EXIT COURSE</button>'}<button id="qt">QUIT</button>${sensHtml()}`);
  bindSens(); $('rs').onclick = () => { hideMenu(); state = 'play'; lockPointer(); last = performance.now(); }; $('qt').onclick = titleMenu; if ($('ex')) $('ex').onclick = () => { levelIdx = -1; startLevel(); };
}
function die(fell) {
  if (state !== 'play') return;
  if (boss && boss.st !== 'dead') { boss.hp = boss.maxHp; boss.pos.copy(boss.home); boss.st = 'intro'; boss.t = 1.5; boss.met = false; }
  state = 'dying'; lives--; SFX.die(); dieT = 1.6;
  if (!fell) player.vel.set(0, 10, 0);
}
let dieT = 0;
function afterDeath() {
  if (lives > 0) { state = 'play'; respawn(); centerMsg('TRY AGAIN', 'LIVES x' + lives); }
  else showMenu(`<h1>GAME OVER</h1><h2>SCORE ${score} - COINS ${coinCount}</h2><button id="ag">MAIN MENU</button>`), $('ag').onclick = titleMenu, state = 'over';
}
function extract() {
  music.stop(); state = 'warp'; score += 1000; SFX.oneup();
  const first = !starsGot[levelIdx]; starsGot[levelIdx] = true; saveStars();
  showMenu(`<h1 style="color:#ffd020;font-size:clamp(40px,9vw,90px)">STAR GET!</h1><h2>${P.name}${first ? '' : ' (ALREADY COLLECTED)'}</h2>
    <p>POWER STARS: ${starCount()} / ${PLANETS.length} &nbsp;|&nbsp; SCORE ${score}</p><button id="nx">BACK TO THE CASTLE</button>`);
  $('nx').onclick = () => { levelIdx = -1; startLevel(); };
}
function ending() {
  music.stop(); state = 'warp'; SFX.flag(); SFX.oneup();
  showMenu(`<h1 style="color:#ffd020">THE BIG DOOR OPENS!</h1><h2>YOU COLLECTED EVERY POWER STAR</h2><p>THANKS FOR PLAYING STAR HOPPER 64 &nbsp;|&nbsp; FINAL SCORE ${score}</p>
    <button id="nx">PLAY AGAIN</button>`);
  $('nx').onclick = () => { starsGot.length = 0; saveStars(); titleMenu(); };
}

// ======================= main loop =======================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.033); last = Math.max(last, now); const t = now / 1000;
  if (state === 'play') { updatePlayer(dt); if (state === 'play') updateBoss(dt); updateHud(dt);
    for (const f of flags) if (f.drop) { f.g.position.y = Math.max(f.y, f.g.position.y - dt * 8); if (f.g.position.y <= f.y) f.drop = false; } }
  else if (state === 'dying') {
    player.vel.y -= 30 * dt; player.pos.y += player.vel.y * dt; dieT -= dt; if (dieT <= 0) afterDeath(); updateHud(dt);
  } else if (state === 'menu') {
    cam.yaw += dt * 0.15; cam.pitch = 0.3; input.lookX = input.lookY = 0;
  }
  if (level) { updateWorld(dt, t); updateHeroModel(dt); updateCamera(dt); }
  renderer.render(scene, camera);
}
levelIdx = -1; buildLevel(); titleMenu();
(document.fonts && document.fonts.load ? document.fonts.load("20px 'Luckiest Guy'").catch(() => {}) : Promise.resolve()).then(() => {
  // redraw the stencil "?" once the font is available
  requestAnimationFrame(frame);
});
</script>
