<html lang="en">
<head>

<title>Planet Hopper 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

  #center small{display:block;font-size:14px;color:#e8e4d8;margin-top:8px}

    background:radial-gradient(#1a1a14dd,#000000f2);text-align:center;padding:16px;z-index:5}

<script>

// film grain overlay
(function grain() {

// ======================= audio =======================
let AC = null, NOISE = null;
function ac() {

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d); } catch (e) {} }
const SFX = {
  jump: n => tone([330, 400, 500][n], 0.2, 'square', 500 + n * 200, 0.05),
  coin: () => { tone(988, 0.07, 'square', 0, 0.04); setTimeout(() => tone(1319, 0.25, 'square', 0, 0.04), 60); },
  stomp: () => { noise(0.15, 1200, 0.25); tone(200, 0.15, 'triangle', -120, 0.15); },
  bump: () => tone(140, 0.1, 'triangle', 0, 0.15),
  brk: () => noise(0.35, 2500, 0.3),
  hurt: () => { noise(0.2, 900, 0.3); tone(220, 0.3, 'sawtooth', -150, 0.08); },
  pound: () => { noise(0.4, 500, 0.5); tone(70, 0.3, 'sine', -30, 0.4); },
  land: () => noise(0.06, 500, 0.08),
  flag: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'square', 0, 0.04), i * 90)),
  die: () => [494, 440, 392, 330].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'square', 0, 0.05), i * 170)),
  warp: () => { tone(80, 2.5, 'sawtooth', 900, 0.06); noise(2.5, 300, 0.2); },
  oneup: () => [659, 784, 1319, 1046, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, 0.1, 'square', 0, 0.04), i * 80)),
};

// ======================= planets (muted, gritty palettes) =======================
const PLANETS = [
  { name: 'TERRA NOVA', grav: 1, fric: 11, skyTop: 0x5d7488, skyHz: 0xcdc6ae, fog: 0xb7b19a, fogN: 40, fogF: 230, sun: 0xffe2b8, hemiG: 0x4a4030,
    top: [96, 112, 62], top2: [74, 88, 48], stone: [118, 112, 100], stone2: [84, 80, 72], metal: [96, 84, 70], moon: 0xe8e0c8, enemy: [0x8a3a18, 0xb8683a], eye: 0xa0ff60, tip: 'STANDARD GRAVITY' },
  { name: 'MAGMA PRIME', grav: 1.12, fric: 11, skyTop: 0x1c0c0a, skyHz: 0x8a3a1a, fog: 0x4a2014, fogN: 25, fogF: 170, sun: 0xffa870, hemiG: 0x301008,
    top: [64, 58, 56], top2: [40, 36, 36], stone: [80, 64, 58], stone2: [50, 40, 38], metal: [70, 60, 56], moon: 0xffa040, enemy: [0xb09020, 0xe8d060], eye: 0xff3010, lava: true, tip: 'HEAVY GRAVITY - LAVA BELOW' },
  { name: 'CRYO-7', grav: 0.95, fric: 1.8, skyTop: 0x4a5a6a, skyHz: 0xc8d0d4, fog: 0xaab6be, fogN: 25, fogF: 170, sun: 0xe8f0ff, hemiG: 0x506070,
    top: [214, 220, 226], top2: [180, 192, 204], stone: [112, 122, 130], stone2: [80, 90, 100], metal: [90, 100, 110], moon: 0xd0e0f0, enemy: [0x3a48a8, 0x7888d8], eye: 0xffffff, tip: 'ICE - YOU WILL SLIDE' },
  { name: 'NEBULA X', grav: 0.55, fric: 11, skyTop: 0x0c0618, skyHz: 0x5a3868, fog: 0x3a2a48, fogN: 30, fogF: 200, sun: 0xf0c8ff, hemiG: 0x201030,
    top: [96, 76, 116], top2: [66, 50, 84], stone: [84, 78, 100], stone2: [56, 50, 70], metal: [76, 70, 90], moon: 0x80e0d0, enemy: [0x1a9050, 0x60d090], eye: 0xff40ff, rings: true, tip: 'LOW GRAVITY - HUGE JUMPS' },
];

// ======================= procedural "photo-ish" textures =======================
function mkR(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function vnoise(size, cells, R) {

    const fx = x / size * cells, fy = y / size * cells, ix = Math.floor(fx), iy = Math.floor(fy);
    let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
    const a = lat[(iy % cells) * cells + ix % cells], b = lat[(iy % cells) * cells + (ix + 1) % cells];

}

}
function makeTex(size, fn) {

    img.data[i] = clamp(r, 0, 255); img.data[i + 1] = clamp(gg, 0, 255); img.data[i + 2] = clamp(b, 0, 255); img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI; return { tex: t, canvas: c, g };
}
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
function buildTextures(P, seed) {
  const R = mkR(seed), S = 256;

  // ground top: dirt/grass/snow/ash with clumps, pebbles, cracks
  const top = makeTex(S, (x, y) => {
    const i = y * S + x, v = n1[i], d = n2[i];
    let c = mix(P.top2, P.top, clamp((v - 0.35) * 2.5, 0, 1));
    c = mul(c, 0.78 + d * 0.45);
    if (n3[i] > 0.72) c = mix(c, mul(P.stone2, 0.9), 0.55);
    if (R() < 0.04) c = mul(c, R() < 0.5 ? 0.7 : 1.2);
    if (P.lava) { const cr = Math.abs(v - 0.5); if (cr < 0.012) c = [255, 120 + d * 80, 20]; else if (cr < 0.025) c = mix(c, [120, 30, 10], 0.6); }
    return c;
  });

  const rows = 6, rowH = S / rows, bw = [];
  for (let r = 0; r < rows; r++) { const arr = []; let x = -R() * 40; while (x < S) { const w = 40 + R() * 50; arr.push([x, w, 0.8 + R() * 0.35]); x += w; } bw.push(arr); }
  const stone = makeTex(S, (x, y) => {
    const i = y * S + x, r = Math.floor(y / rowH), ly = y - r * rowH;
    let blk = bw[r][0]; for (const b of bw[r]) if (x >= b[0] && x < b[0] + b[1]) blk = b; else if (x + S >= b[0] && x + S < b[0] + b[1]) blk = b;
    const lx = ((x - blk[0]) % S + S) % S;
    let c = mix(P.stone2, P.stone, n1[i]); c = mul(c, blk[2] * (0.75 + n2[i] * 0.45));

    let c = mul(P.metal, 0.7 + n2[i] * 0.5);

    if (px < 3 || py < 3) c = mul(c, 0.4); else if (px < 5 || py < 5) c = mul(c, 1.3);

}
// ? block / used block / brick — shared, weathered army-stencil look
const QTEX = (() => {
  const R = mkR(7), S = 128, n = fbm(S, R), n2 = fbm(S, R, [[16, 0.6], [32, 0.4]]);
  const q = makeTex(S, (x, y) => { const i = y * S + x; let c = mul([214, 160, 40], 0.7 + n[i] * 0.5);
    if (n2[i] > 0.66) c = mix(c, [90, 70, 50], 0.7);                          // chipped paint -> metal
    if (x < 8 || y < 8 || x > S - 9 || y > S - 9) c = mul([70, 60, 50], 0.8 + n[i] * 0.4);
    for (const [rx, ry] of [[16, 16], [111, 16], [16, 111], [111, 111]]) if (Math.hypot(x - rx, y - ry) < 5) c = [60, 50, 40];
    return c; });
  q.g.font = 'bold 84px "Black Ops One", Impact, sans-serif'; q.g.textAlign = 'center'; q.g.textBaseline = 'middle';
  q.g.fillStyle = '#2a1a08'; q.g.globalAlpha = 0.85; q.g.fillText('?', 66, 70); q.g.fillStyle = '#f4e6c0'; q.g.globalAlpha = 0.9; q.g.fillText('?', 63, 66); q.tex.needsUpdate = true;
  const used = makeTex(S, (x, y) => { const i = y * S + x; let c = mul([92, 70, 50], 0.6 + n[i] * 0.6);
    if (x < 8 || y < 8 || x > S - 9 || y > S - 9) c = mul(c, 0.6); for (const [rx, ry] of [[16, 16], [111, 16], [16, 111], [111, 111]]) if (Math.hypot(x - rx, y - ry) < 5) c = [40, 30, 20]; return c; });
  const brick = makeTex(S, (x, y) => { const i = y * S + x, r = y >> 5, ly = y & 31, lx = (x + (r & 1 ? 32 : 0)) & 63;
    let c = mul([140, 64, 40], 0.65 + n[i] * 0.55); if (n2[i] > 0.7) c = mix(c, [170, 160, 140], 0.35);
    if (ly < 3 || lx < 3) c = [58, 50, 44]; else if (ly < 5 || lx < 5) c = mul(c, 1.2); return c; });

})();

// UVs in world units so textures don't stretch
function worldBox(w, h, d, s = 4) {
  const g = new THREE.BoxGeometry(w, h, d), uv = g.attributes.uv;

  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k, [a, b] = dims[f];
    uv.setXY(i, uv.getX(i) * a / s, f === 2 || f === 3 ? uv.getY(i) * b / s : 1 - (1 - uv.getY(i)) * b / s); }

}
const std = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.9, metalness: 0 }, o));
function shadowed(m) { m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return m; }

// ======================= hero (3D plumber) =======================
function buildHero() {
  const g = new THREE.Group(), M = (c, r = 0.7, m = 0) => std({ color: c, roughness: r, metalness: m });
  const red = M(0xb01a14, 0.6), blue = M(0x223e8c, 0.85), skin = M(0xe8a880, 0.65), white = M(0xeeeae0, 0.6), brown = M(0x4a2810, 0.55),
    dark = M(0x2a160a, 0.9), gold = M(0xd8a830, 0.3, 0.8), eyeB = M(0x2050c0, 0.3);
  const add = (geo, mat, x, y, z, parent = g) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  const H = { g, legs: [], arms: [] };
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * 0.17, 0.72, 0); g.add(leg);
    add(new THREE.CylinderGeometry(0.13, 0.12, 0.5, 10), blue, 0, -0.25, 0, leg);
    const shoe = add(new THREE.SphereGeometry(0.16, 12, 8), brown, 0, -0.56, 0.07, leg); shoe.scale.set(1, 0.62, 1.55);
    add(new THREE.BoxGeometry(0.26, 0.04, 0.42), dark, 0, -0.64, 0.07, leg);
    H.legs.push(leg);
  }
  add(new THREE.CylinderGeometry(0.3, 0.35, 0.46, 14), blue, 0, 0.94, 0);                  // overalls
  add(new THREE.CylinderGeometry(0.28, 0.3, 0.3, 14), red, 0, 1.3, 0);                     // shirt
  add(new THREE.SphereGeometry(0.28, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), red, 0, 1.44, 0).scale.y = 0.5;
  add(new THREE.BoxGeometry(0.4, 0.26, 0.05), blue, 0, 1.2, 0.27);                         // bib
  for (const s of [-1, 1]) { const st = add(new THREE.BoxGeometry(0.07, 0.34, 0.06), blue, s * 0.14, 1.34, 0.25); st.rotation.x = -0.2;
    add(new THREE.SphereGeometry(0.045, 8, 6), gold, s * 0.14, 1.22, 0.3); }

    const m = new THREE.Mesh(new THREE.CylinderGeometry(rand(8, 20), rand(20, 40), h, 7), std({ map: TX.rock, flatShading: true }));

  } else if (state === 'menu') {
    cam.yaw += dt * 0.15; cam.pitch = 0.3; input.lookX = input.lookY = 0;
  }
  if (level) { updateWorld(dt, t); updateHeroModel(dt); updateCamera(dt); }
  renderer.render(scene, camera);
}
