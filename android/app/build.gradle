plugins {
    id 'com.android.application'
}

android {
    namespace 'com.planethopper.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.planethopper.game"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Two games share this wrapper; each flavor ships its own HTML from the repo root.
    flavorDimensions "game"
    productFlavors {
        planet {
            dimension "game"
            applicationId "com.planethopper.game"
            resValue "string", "app_name", "Planet Hopper"
        }
        beat {
            dimension "game"
            applicationId "com.beatbattle.game"
            resValue "string", "app_name", "Beat Battle"
        }
        retro {
            dimension "game"
            applicationId "com.retrohopper.game"
            resValue "string", "app_name", "Retro Hopper"
        }
        star {
            dimension "game"
            applicationId "com.starhopper64.game"
            resValue "string", "app_name", "Star Hopper 64"
        }
    }
    sourceSets.planet.assets.srcDirs += "$buildDir/gameAssets/planet"
    sourceSets.beat.assets.srcDirs += "$buildDir/gameAssets/beat"
    sourceSets.retro.assets.srcDirs += "$buildDir/gameAssets/retro"
    sourceSets.star.assets.srcDirs += "$buildDir/gameAssets/star"
}

tasks.register('copyPlanet', Copy) {
    from("$rootDir/..") {
        include 'index.html', 'three.min.js'
    }
    into "$buildDir/gameAssets/planet"
}
tasks.register('copyBeat', Copy) {
    from "$rootDir/../beatbattle/index.html"
    into "$buildDir/gameAssets/beat"
}
tasks.register('copyRetro', Copy) {
    from "$rootDir/../retro/index.html"
    into "$buildDir/gameAssets/retro"
}
tasks.register('copyStar', Copy) {
    from("$rootDir/../star64") {
        include 'index.html', 'three.min.js'
    }
    into "$buildDir/gameAssets/star"
}
preBuild.dependsOn 'copyPlanet', 'copyBeat', 'copyRetro', 'copyStar'

