<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Beat Battle</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ====================== canvas / virtual resolution ======================
const VW = 1280, VH = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1, OX = 0, OY = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  SC = Math.min(innerWidth / VW, innerHeight / VH); OX = (innerWidth - VW * SC) / 2; OY = (innerHeight - VH * SC) / 2;
}
addEventListener('resize', resize); resize();
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function mkR(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

// ====================== audio engine ======================
let AC = null, MASTER = null, NOISE = null, MUSIC = null, VOX = null;
function ac() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createDynamicsCompressor(); MASTER.threshold.value = -14; MASTER.ratio.value = 4; MASTER.connect(AC.destination);
    MUSIC = AC.createGain(); MUSIC.gain.value = 0.8; MUSIC.connect(MASTER);
    VOX = AC.createGain(); VOX.gain.value = 0.9; VOX.connect(MASTER);
    const n = AC.sampleRate * 2; NOISE = AC.createBuffer(1, n, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function kick(t, v = 1) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
  env(g, t, 0.003, 0.9 * v, 0.32); o.connect(g); g.connect(MUSIC); o.start(t); o.stop(t + 0.35); }
function noiseHit(t, type, freq, q, peak, dur, dest = MUSIC) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = type; f.frequency.value = freq; f.Q.value = q; env(g, t, 0.002, peak, dur); s.connect(f); f.connect(g); g.connect(dest);
  s.start(t, Math.random()); s.stop(t + dur + 0.02); }
function snare(t) { noiseHit(t, 'bandpass', 1800, 0.8, 0.55, 0.2); const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(240, t); o.frequency.exponentialRampToValueAtTime(150, t + 0.08); env(g, t, 0.002, 0.35, 0.12); o.connect(g); g.connect(MUSIC); o.start(t); o.stop(t + 0.15); }
function hat(t, open) { noiseHit(t, 'highpass', 8000, 0.5, open ? 0.14 : 0.09, open ? 0.2 : 0.045); }
function clap(t) { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1400, 1.5, 0.3, 0.12); }
function bass(t, m, dur) { const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = mtof(m); o2.frequency.value = mtof(m - 12);
  f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(180, t + dur); f.Q.value = 6;
  env(g, t, 0.005, 0.32, dur); o.connect(f); o2.connect(f); f.connect(g); g.connect(MUSIC); o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05); }
function pad(t, notes, dur) { for (const m of notes) for (const det of [-7, 7]) { const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; f.type = 'lowpass'; f.frequency.value = 1400;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.028, t + 0.08); g.gain.setValueAtTime(0.028, t + dur - 0.1); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(MUSIC); o.start(t); o.stop(t + dur + 0.05); } }
function stab(t, notes) { for (const m of notes) { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = mtof(m + 12);
  env(g, t, 0.003, 0.035, 0.14); o.connect(g); g.connect(MUSIC); o.start(t); o.stop(t + 0.16); } }
// formant "voice" — gives each character a singing timbre
const VOWELS = [[800, 1150], [400, 1600], [350, 2000], [600, 1000]];   // ah, eh, ee, oh by lane
function voice(t, m, dur, who, lane) {
  const vw = VOWELS[lane], o = AC.createOscillator(), o2 = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
  o.type = 'sawtooth'; o2.type = who === 0 ? 'square' : 'sawtooth';
  const f = mtof(m + (who === 0 ? -12 : 0)); o.frequency.setValueAtTime(f * 1.06, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.05);
  o2.frequency.value = f * 1.005; lfo.frequency.value = 5.5; lg.gain.value = f * 0.012; lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  const mixG = AC.createGain(); mixG.gain.value = 0.5; o.connect(mixG); o2.connect(mixG);
  for (const [fq, gn] of [[vw[0] * (who === 0 ? 0.85 : 1.1), 1], [vw[1] * (who === 0 ? 0.85 : 1.1), 0.6]]) {
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fq; bp.Q.value = 5; const bg = AC.createGain(); bg.gain.value = gn;
    mixG.connect(bp); bp.connect(bg); bg.connect(g); }
  const d = Math.max(0.13, dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.02); g.gain.setValueAtTime(0.9, t + d - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.06);
  g.connect(VOX); for (const x of [o, o2, lfo]) { x.start(t); x.stop(t + d + 0.1); }
  return g;
}
function missSfx() { const t = AC.currentTime; noiseHit(t, 'lowpass', 500, 1, 0.5, 0.2, MASTER);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.25);
  env(g, t, 0.005, 0.18, 0.28); o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + 0.3); }
function uiBlip(f = 880) { ac(); const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = f;
  env(g, t, 0.003, 0.08, 0.1); o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + 0.12); }

// ====================== songs & chart generation ======================
const SONGS = [
  { name: 'Neon Alley', bpm: 118, key: 57, prog: [0, 8, 3, 10], seed: 11, enemy: 'VEX', diffBase: 0 },
  { name: 'Rooftop Riot', bpm: 142, key: 52, prog: [0, 5, 8, 7], seed: 23, enemy: 'VEX', diffBase: 1 },
  { name: 'Last Stand', bpm: 168, key: 50, prog: [0, 10, 8, 7], seed: 37, enemy: 'VEX', diffBase: 2 },
];
const DIFFS = ['EASY', 'NORMAL', 'HARD'];
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const chordOf = (key, deg) => { const r = key + deg; const third = [0, 5, 7].includes(deg) || deg === 0 ? 3 : 4; return [r, r + (deg === 3 || deg === 10 || deg === 8 ? 4 : 3), r + 7]; };
function buildChart(song, diff) {
  const R = mkR(song.seed * 97 + diff * 13), lvl = clamp(song.diffBase + diff - 1, 0, 3);
  const stepDur = 60 / song.bpm / 4, INTRO = 16 * 2, PHR = 32, TURNS = 10;   // 2-bar count-in, 10 call-and-response turns
  const notes = [];
  const p8 = [0.42, 0.55, 0.68, 0.78][lvl], p16 = [0, 0.08, 0.25, 0.42][lvl], pHold = 0.14;
  for (let turn = 0; turn < TURNS; turn++) {
    const phrase = []; let lastLane = -1, s = 0;
    const heat = turn >= TURNS - 4 ? 0.1 : 0;
    while (s < PHR - 2) {
      const on8 = s % 2 === 0, strong = s % 8 === 0;
      const p = strong ? 0.85 : on8 ? p8 + heat : p16 + heat;
      if (R() < p) {
        let lane = R() * 4 | 0; if (lane === lastLane && R() < 0.6) lane = (lane + 1 + (R() * 3 | 0)) % 4; lastLane = lane;
        let len = 0; if (on8 && R() < pHold && s < PHR - 6) len = 2 + (R() * 3 | 0) * 2;
        const deg = MINOR[(lane * 2 + (R() < 0.3 ? 1 : 0)) % 7] + (lane === 2 ? 12 : 0);
        phrase.push({ s, lane, len, m: song.key + 12 + deg });
        // occasional chord (two lanes at once) on hard
        if (lvl >= 2 && strong && R() < 0.2) { const l2 = (lane + 2) % 4; phrase.push({ s, lane: l2, len: 0, m: song.key + 12 + MINOR[(l2 * 2) % 7] }); }
        s += len ? len + 2 : 1; continue;
      }
      s++;
    }
    const base = INTRO + turn * PHR * 2;
    for (const who of [0, 1]) for (const n of phrase) {
      const st = base + who * PHR + n.s;
      notes.push({ t: st * stepDur, step: st, lane: n.lane, who, len: n.len * stepDur, m: n.m, hit: false, miss: false, holding: false, done: false, voice: null });
    }
  }
  notes.sort((a, b) => a.t - b.t);
  const totalSteps = INTRO + TURNS * PHR * 2 + 32;
  return { notes, stepDur, totalSteps, INTRO };
}

// ====================== game state ======================
let state = 'title', menuSel = 0, diffSel = 1, songSel = 0, story = false, storyIdx = 0;
let downscroll = store('bb_down') === '1', offsetMs = parseInt(store('bb_off') || '0', 10) || 0;
let song = null, chart = null, songStart = 0, nextStep = 0, pausedAt = 0;
let health = 1, score = 0, combo = 0, maxCombo = 0, misses = 0, hitsW = 0, hitsN = 0, beatPulse = 0, camZoom = 1, camX = 0;
let popups = [], lastBeat = -1, countIn = '', endTimer = 0, storyScore = 0;
const lanePressed = [false, false, false, false], strumGlow = [[0, 0, 0, 0], [0, 0, 0, 0]];
const pose = [{ p: 'idle', t: 0 }, { p: 'idle', t: 0 }];
const LANE_COL = ['#c24bff', '#00e4ff', '#12fa05', '#f9393f'];
const LANE_DARK = ['#6a1b8f', '#006f8a', '#0a8a03', '#8a1418'];
const LANE_NAMES = ['left', 'down', 'up', 'right'];
const songTime = () => AC ? AC.currentTime - songStart - offsetMs / 1000 : 0;

function startSong(idx) {
  ac();
  song = SONGS[idx]; songSel = idx; chart = buildChart(song, diffSel);
  health = 1; score = 0; combo = 0; maxCombo = 0; misses = 0; hitsW = 0; hitsN = 0; popups = []; lastBeat = -1; endTimer = 0;
  pose[0] = { p: 'idle', t: 0 }; pose[1] = { p: 'idle', t: 0 };
  songStart = AC.currentTime + 0.6; nextStep = 0; state = 'play';
}
function scheduler() {
  if (state !== 'play' || !chart) return;
  const sd = chart.stepDur;
  while (songStart + nextStep * sd < AC.currentTime + 0.18 && nextStep < chart.totalSteps) {
    const s = nextStep, t = songStart + s * sd, bar = Math.floor(s / 16), inBar = s % 16;
    const intro = s < chart.INTRO, outro = s >= chart.totalSteps - 32, lvl = song.diffBase;
    if (intro) { if (inBar % 4 === 0 && s >= 16) { stab(t, [song.key + 12]); } if (inBar % 4 === 0) hat(t, true); }
    else {
      const chord = chordOf(song.key, song.prog[bar % 4]);
      if (inBar === 0) pad(t, chord.map(n => n + 12), sd * 16);
      if (inBar === 0 || inBar === 8 || (lvl > 0 && inBar === 10) || (lvl > 1 && inBar === 14)) kick(t);
      if (inBar === 4 || inBar === 12) { snare(t); if (lvl > 0) clap(t); }
      if (lvl > 1 ? true : inBar % 2 === 0) hat(t, inBar % 4 === 2);
      if (inBar % 2 === 0) bass(t, chord[0] - 12 + (inBar === 6 || inBar === 14 ? 12 : 0), sd * 1.8);
      if ([3, 6, 11].includes(inBar)) stab(t, chord);
      if (outro && inBar === 0 && s === chart.totalSteps - 32) { /* final chord already */ }
    }
    for (const n of chart.notes) if (n.who === 0 && n.step === s) voice(t, n.m, n.len || sd * 1.5, 0, n.lane);
    nextStep++;
  }
}
setInterval(scheduler, 25);

// ====================== input & judging ======================
const WIN = { perfect: 0.045, great: 0.09, good: 0.135, bad: 0.165 };
function press(lane) {
  if (state !== 'play') return;
  if (lanePressed[lane]) return; lanePressed[lane] = true;
  const t = songTime();
  let best = null, bd = 1e9;
  for (const n of chart.notes) {
    if (n.who !== 1 || n.hit || n.miss || n.lane !== lane) continue;
    const d = Math.abs(n.t - t); if (d < bd) { bd = d; best = n; }
    if (n.t - t > WIN.bad) break;
  }
  if (best && bd <= WIN.bad) {
    best.hit = true;
    const r = bd <= WIN.perfect ? ['PERFECT!!', 350, 1, 0.023] : bd <= WIN.great ? ['GREAT!', 200, 0.75, 0.018] : bd <= WIN.good ? ['GOOD', 100, 0.5, 0.01] : ['BAD', 50, 0.25, -0.01];
    score += r[1]; hitsW += r[2]; hitsN++; combo++; maxCombo = Math.max(maxCombo, combo); health = clamp(health + r[3], 0, 2);
    popups.push({ txt: r[0], combo, t: 0 });
    strumGlow[1][lane] = best.len ? 99 : 0.18; pose[1] = { p: LANE_NAMES[lane], t: best.len ? 99 : 0.4 };
    best.voice = voice(AC.currentTime, best.m, best.len ? best.len - (t - best.t) : 0.18, 1, lane);
    if (best.len) best.holding = true; else best.done = true;
  } else {
    // ghost tapping is allowed (like the original), no penalty
  }
}
function release(lane) {
  lanePressed[lane] = false;
  if (state !== 'play') return;
  const t = songTime();
  for (const n of chart.notes) if (n.holding && n.lane === lane) {
    n.holding = false; n.done = true; strumGlow[1][lane] = 0; pose[1].t = 0.2;
    if (n.t + n.len - t > 0.12) { // let go early: cut the voice, small penalty
      try { n.voice.gain.cancelScheduledValues(AC.currentTime); n.voice.gain.setTargetAtTime(0.0001, AC.currentTime, 0.02); } catch (e) {}
      health = clamp(health - 0.02, 0, 2);
    }
  }
}
function registerMiss(n) {
  n.miss = true; misses++; combo = 0; hitsN++; health = clamp(health - 0.0475, 0, 2); score -= 10;
  pose[1] = { p: 'miss' + n.lane, t: 0.45 }; missSfx(); popups.push({ txt: 'MISS', combo: 0, t: 0, miss: true });
}
const KEYMAP = { ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3, KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3, KeyA: 0, KeyS: 1, KeyW: 2, KeyL: 3 };
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (state === 'play') {
    if (e.code in KEYMAP) { press(KEYMAP[e.code]); e.preventDefault(); }
    if (e.code === 'Enter' || e.code === 'Escape' || e.code === 'KeyP') pauseGame();
    if (e.code === 'KeyR') startSong(songSel);
    return;
  }
  menuKey(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { if (e.code in KEYMAP) release(KEYMAP[e.code]); });
// touch / mouse: in play, screen split into 4 lane columns; in menus, tap buttons
const activeTouches = {};
function toVirtual(x, y) { return [(x - OX) / SC, (y - OY) / SC]; }
function laneFromX(x) { return clamp(Math.floor(x / innerWidth * 4), 0, 3); }
addEventListener('touchstart', e => { e.preventDefault(); ac();
  for (const t of e.changedTouches) {
    if (state === 'play') { const [vx, vy] = toVirtual(t.clientX, t.clientY);
      if (vx > 600 && vx < 680 && vy < 60) { pauseGame(); continue; }
      const l = laneFromX(t.clientX); activeTouches[t.identifier] = l; press(l); }
    else menuClick(...toVirtual(t.clientX, t.clientY));
  } }, { passive: false });
function tEnd(e) { for (const t of e.changedTouches) if (t.identifier in activeTouches) { const l = activeTouches[t.identifier]; delete activeTouches[t.identifier];
  if (!Object.values(activeTouches).includes(l)) release(l); } }
addEventListener('touchend', tEnd); addEventListener('touchcancel', tEnd);
cv.addEventListener('mousedown', e => { if (isTouch) return; ac(); if (state !== 'play') menuClick(...toVirtual(e.clientX, e.clientY)); });
addEventListener('blur', () => { if (state === 'play') pauseGame(); });

// ====================== menus ======================
let buttons = [];
function btn(label, x, y, w, h, fn, sel) { buttons.push({ label, x, y, w, h, fn, sel }); }
function menuClick(x, y) { for (const b of buttons) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { uiBlip(); b.fn(); return; } }
function menuItems() { return buttons.filter(b => !b.noKey); }
function menuKey(code) {
  ac();
  const items = menuItems(); if (!items.length) return;
  if (code === 'ArrowUp' || code === 'KeyW') { menuSel = (menuSel - 1 + items.length) % items.length; uiBlip(660); }
  if (code === 'ArrowDown' || code === 'KeyS') { menuSel = (menuSel + 1) % items.length; uiBlip(660); }
  if ((code === 'ArrowLeft' || code === 'ArrowRight') && items[menuSel] && items[menuSel].side) { items[menuSel].side(code === 'ArrowRight' ? 1 : -1); uiBlip(770); }
  if (code === 'Enter' || code === 'Space') { const b = items[menuSel]; if (b) { uiBlip(990); b.fn(); } }
  if (code === 'Escape' || code === 'Backspace') { if (state === 'freeplay' || state === 'options') { state = 'title'; menuSel = 0; } else if (state === 'pause') resumeGame(); }
}
function pauseGame() { if (state !== 'play') return; state = 'pause'; pausedAt = AC.currentTime; AC.suspend(); menuSel = 0; for (let i = 0; i < 4; i++) lanePressed[i] = false; }
function resumeGame() { state = 'play'; AC.resume(); }
function winSong() {
  storyScore += score;
  if (story && storyIdx < SONGS.length - 1) { storyIdx++; state = 'between'; endTimer = 0; menuSel = 0; }
  else { state = 'results'; menuSel = 0; }
}

// ====================== drawing helpers ======================
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function arrowPath(size) {
  const s = size / 2; ctx.beginPath();
  ctx.moveTo(0, -s); ctx.lineTo(s, 0.05 * s); ctx.lineTo(0.42 * s, 0.05 * s); ctx.lineTo(0.42 * s, s * 0.95);
  ctx.lineTo(-0.42 * s, s * 0.95); ctx.lineTo(-0.42 * s, 0.05 * s); ctx.lineTo(-s, 0.05 * s); ctx.closePath();
}
const LANE_ROT = [-Math.PI / 2, Math.PI, 0, Math.PI / 2];
function drawArrow(x, y, lane, size, fill, outline = '#000', alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(LANE_ROT[lane]); ctx.globalAlpha = alpha;
  arrowPath(size); ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.13; ctx.strokeStyle = outline; ctx.stroke();
  const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2); g.addColorStop(0, '#ffffff'); g.addColorStop(0.18, fill); g.addColorStop(1, fill);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = size * 0.05; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
  ctx.restore();
}
function text(s, x, y, size, col = '#fff', align = 'center', stroke = 6) {
  ctx.font = `900 ${size}px "Arial Black", Impact, "Segoe UI", sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = '#000'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

// ====================== characters (original designs) ======================
// Pose offsets: body lean, arm angles, mouth open
const POSES = {
  idle: { lean: 0, la: 0.3, ra: -0.3, dy: 0, head: 0 },
  left: { lean: -0.22, la: -1.3, ra: -0.1, dy: 0, head: -0.15 },
  down: { lean: 0, la: 0.9, ra: -0.9, dy: 22, head: 0.2 },
  up: { lean: 0.02, la: -2.5, ra: 0.3, dy: -12, head: -0.25 },
  right: { lean: 0.22, la: 0.1, ra: 1.3, dy: 0, head: 0.15 },
};
function limb(x1, y1, len, ang, w, col) { const x2 = x1 + Math.sin(ang) * len, y2 = y1 + Math.cos(ang) * len;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#000'; ctx.lineWidth = w + 8; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); return [x2, y2]; }
function blobOut(fn, col) { ctx.save(); fn(); ctx.lineWidth = 7; ctx.strokeStyle = '#000'; ctx.stroke(); ctx.fillStyle = col; ctx.fill(); ctx.restore(); }
// Player: "Rico" — spiky orange hair, green jacket, mic in hand
function drawRico(x, y, poseName, bob, flip) {
  const miss = poseName.startsWith('miss'), pn = miss ? LANE_NAMES[+poseName.slice(4)] : poseName, P = POSES[pn] || POSES.idle;
  ctx.save(); ctx.translate(x, y + P.dy * 0.6 + bob); if (flip) ctx.scale(-1, 1);

      { label: 'OFFSET +10', fn: () => { offsetMs = clamp(offsetMs + 10, -300, 300); store('bb_off', offsetMs); } },
      { label: 'OFFSET -10', fn: () => { offsetMs = clamp(offsetMs - 10, -300, 300); store('bb_off', offsetMs); } },
      { label: 'BACK', fn: () => { state = 'title'; menuSel = 0; } },
    ], 640, 230, 90);
    text('RAISE OFFSET IF NOTES FEEL EARLY, LOWER IT IF THEY FEEL LATE', 640, 680, 18, '#ccc', 'center', 4);
  } else if (state === 'pause') {
    panel(0.6); text('PAUSED', 640, 150, 80, '#fff', 'center', 12);
    drawButtonList([{ label: 'RESUME', fn: resumeGame }, { label: 'RESTART SONG', fn: () => { AC.resume(); startSong(songSel); } },
      { label: 'EXIT TO MENU', fn: () => { AC.resume(); state = 'title'; menuSel = 0; } }], 640, 320, 90);
  } else if (state === 'dead') {
    panel(0.75); text('YOU GOT DROPPED!', 640, 180, 76, '#ff4060', 'center', 12);
    ctx.save(); ctx.translate(640, 420); ctx.rotate(Math.sin(t * 3) * 0.1); drawRico(0, 120, 'miss1', 0, true); ctx.restore();
    drawButtonList([{ label: 'RETRY', fn: () => { AC.resume(); startSong(songSel); } }, { label: 'MENU', fn: () => { AC.resume(); state = 'title'; menuSel = 0; } }], 640, 600, 70);
  } else if (state === 'between') {
    panel(0.6); text('WEEK PROGRESS', 640, 150, 50, '#fff', 'center', 8); text(`NEXT: ${SONGS[storyIdx].name}`, 640, 260, 60, '#ffe040', 'center', 10);
    text(`SCORE SO FAR: ${storyScore}`, 640, 350, 36, '#fff', 'center', 6);
    drawButtonList([{ label: 'CONTINUE', fn: () => startSong(storyIdx) }], 640, 480, 80);
  } else if (state === 'results') {
    panel(0.65); const acc = hitsN ? hitsW / hitsN * 100 : 100;
    const rank = misses === 0 ? (acc > 95 ? 'SICK FC!' : 'FULL COMBO') : acc > 90 ? 'A' : acc > 80 ? 'B' : acc > 70 ? 'C' : 'D';
    text(story ? 'WEEK COMPLETE!' : 'SONG CLEARED!', 640, 120, 70, '#40e0ff', 'center', 12);
    text(`RANK: ${rank}`, 640, 230, 60, '#ffe040', 'center', 10);
    text(`SCORE ${story ? storyScore : score}   MAX COMBO ${maxCombo}   MISSES ${misses}   ACC ${acc.toFixed(2)}%`, 640, 320, 26, '#fff', 'center', 6);
    drawButtonList([{ label: 'PLAY AGAIN', fn: () => story ? (storyIdx = 0, storyScore = 0, startSong(0)) : startSong(songSel) }, { label: 'MENU', fn: () => { state = 'title'; menuSel = 0; } }], 640, 460, 90);
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
