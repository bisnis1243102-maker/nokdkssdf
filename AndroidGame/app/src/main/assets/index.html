<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Forsa Horizon 6</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#88b;touch-action:none;font-family:-apple-system,Roboto,sans-serif;}
  #c{display:block;width:100vw;height:100vh;}
  .hud{position:fixed;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;}
  #top{top:10px;left:12px;font-weight:800;}
  #spd{top:10px;right:14px;text-align:right;font-weight:900;font-size:26px;}
  #spd small{font-size:12px;}
  .btn{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.18);
       border:2px solid rgba(255,255,255,.5);color:#fff;font-size:30px;font-weight:900;
       display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;}
  .btn:active{background:rgba(255,255,255,.4);}
  #gas{right:24px;bottom:30px;width:92px;height:92px;background:rgba(40,200,90,.6);}
  #brk{right:130px;bottom:30px;background:rgba(220,60,60,.6);}
  #left{left:24px;bottom:30px;background:rgba(60,120,230,.55);}
  #right{left:130px;bottom:30px;background:rgba(60,120,230,.55);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="hud">FORSA HORIZON 6</div>
<div id="spd" class="hud">0<small> km/h</small></div>
<div id="left" class="btn">◀</div>
<div id="right" class="btn">▶</div>
<div id="brk" class="btn">▼</div>
<div id="gas" class="btn">▲</div>
<script src="three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc4e8);
scene.fog = new THREE.Fog(0xbcd2e8, 120, 900);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 3000);
const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const HALF = 400;

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x556b2f, 0.9));
const sun = new THREE.DirectionalLight(0xfff3da, 1.1);
sun.position.set(120, 200, 80); sun.castShadow = true;
sun.shadow.camera.left=-300; sun.shadow.camera.right=300; sun.shadow.camera.top=300; sun.shadow.camera.bottom=-300;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(HALF*2+200, HALF*2+200),
  new THREE.MeshStandardMaterial({color:0x4f8a3f, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

// Roads grid + buildings
const roadMat = new THREE.MeshStandardMaterial({color:0x23252b, roughness:.9});
const buildings = [];
for (let g=-HALF+40; g<=HALF-40; g+=90){
  const rv = new THREE.Mesh(new THREE.PlaneGeometry(18, HALF*2), roadMat);
  rv.rotation.x=-Math.PI/2; rv.position.set(g,0.02,0); scene.add(rv);
  const rh = new THREE.Mesh(new THREE.PlaneGeometry(HALF*2, 18), roadMat);
  rh.rotation.x=-Math.PI/2; rh.position.set(0,0.02,g); scene.add(rh);
}
const palette=[0x6a89b8,0xb86a6a,0x6ab88a,0xc2b56a,0x8a6ab8,0x9aa3ad];
for (let x=-HALF+50; x<=HALF-50; x+=90){
  for (let z=-HALF+50; z<=HALF-50; z+=90){
    if (Math.abs(x)<60 && Math.abs(z)<60) continue;
    const h = 12 + Math.random()*70;
    const b = new THREE.Mesh(new THREE.BoxGeometry(34, h, 34),
      new THREE.MeshStandardMaterial({color:palette[(Math.random()*palette.length)|0], roughness:.7, metalness:.2}));
    b.position.set(x + (Math.random()*30-15), h/2, z + (Math.random()*30-15));
    b.castShadow = true; scene.add(b);
    buildings.push({x:b.position.x, z:b.position.z, hw:17, hd:17});
  }
}

// Distant mountains
for (let i=0;i<26;i++){
  const a = i/26*Math.PI*2, r = HALF+260+Math.random()*400;
  const mh = 120+Math.random()*220;
  const m = new THREE.Mesh(new THREE.ConeGeometry(mh*0.8, mh, 7),
    new THREE.MeshStandardMaterial({color:0x687786, roughness:1}));
  m.position.set(Math.cos(a)*r, mh/2-5, Math.sin(a)*r); scene.add(m);
}

// Player car
function makeCar(color){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.0,0.7,4.3),
    new THREE.MeshStandardMaterial({color, metalness:.8, roughness:.35}));
  body.position.y=0.6; body.castShadow=true; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.7,0.6,2.0),
    new THREE.MeshStandardMaterial({color:0x14181f, metalness:.3, roughness:.1}));
  cab.position.set(0,1.15,-0.2); g.add(cab);
  const wheelGeo = new THREE.CylinderGeometry(0.45,0.45,0.34,16);
  const wheelMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:.8});
  [[-0.95,1.4],[0.95,1.4],[-0.95,-1.4],[0.95,-1.4]].forEach(p=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat); w.rotation.z=Math.PI/2;
    w.position.set(p[0],0.45,p[1]); g.add(w);
  });
  return g;
}
const car = makeCar(0xd92222); scene.add(car);
let cx=0, cz=170, heading=Math.PI, speed=0;

// Controls
const input = {gas:0, brake:0, steer:0};
function bind(id, on){
  const el=document.getElementById(id);
  const set=(v)=>{ if(id==='gas')input.gas=v; if(id==='brk')input.brake=v;
                   if(id==='left')input.steer=v?-1:(input.steer<0?0:input.steer);
                   if(id==='right')input.steer=v?1:(input.steer>0?0:input.steer); };
  el.addEventListener('touchstart',e=>{e.preventDefault();set(1);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();set(0);},{passive:false});
  el.addEventListener('mousedown',()=>set(1));
  el.addEventListener('mouseup',()=>set(0));
}
['gas','brk','left','right'].forEach(id=>bind(id));

const spdEl = document.getElementById('spd');
let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last=now;

  speed += (input.gas - input.brake) * 30 * dt;
  speed -= speed * (input.gas||input.brake?0.4:1.0) * dt;
  speed = Math.max(-12, Math.min(40, speed));
  if (Math.abs(speed)>0.2){
    const dir = speed>=0?1:-1;
    heading += input.steer * 2.6 * dt * dir * Math.min(1, 0.45+Math.abs(speed)/11);
  }
  const fx=Math.sin(heading), fz=Math.cos(heading);
  let nx=cx+fx*speed*dt, nz=cz+fz*speed*dt;
  const lim=HALF-3; nx=Math.max(-lim,Math.min(lim,nx)); nz=Math.max(-lim,Math.min(lim,nz));
  for(const b of buildings){
    const ex=b.hw+2.3, ez=b.hd+2.3, ddx=nx-b.x, ddz=nz-b.z;
    if(Math.abs(ddx)<ex && Math.abs(ddz)<ez){
      if(ex-Math.abs(ddx)<ez-Math.abs(ddz)) nx=b.x+(ddx<0?-ex:ex); else nz=b.z+(ddz<0?-ez:ez);
      speed*=0.3;
    }
  }
  cx=nx; cz=nz;
  car.position.set(cx,0,cz); car.rotation.y=heading;

  const camPos = new THREE.Vector3(cx-fx*15, 8.5, cz-fz*15);
  camera.position.lerp(camPos, Math.min(1,dt*4.5));
  camera.lookAt(cx+fx*6, 1.6, cz+fz*6);

  spdEl.innerHTML = Math.round(Math.abs(speed)*7.5)+'<small> km/h</small>';
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
requestAnimationFrame(loop);
</script>
</body>
</html>
